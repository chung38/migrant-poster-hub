name: 更新移工相關法規

on:
  schedule:
    # 每天台灣時間約 03:37 檢查全國法規資料庫的最新修正日期
    - cron: '37 19 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: crawl
  cancel-in-progress: false

jobs:
  laws:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 安裝套件
        run: npm install --no-audit --no-fund
      - name: 讀取法規
        run: node crawler/laws.js
      - name: 存回 GitHub
        run: |
          git config user.name "poster-bot"
          git config user.email "poster-bot@users.noreply.github.com"
          git add -A docs
          if git diff --cached --quiet; then echo "沒有變更"; else
            git commit -m "法規更新 $(TZ=Asia/Taipei date +'%Y-%m-%d')"
            git pull --rebase && git push
          fi
