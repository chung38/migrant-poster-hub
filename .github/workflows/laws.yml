name: 更新移工相關法規與政策公告

on:
  schedule:
    # 每天台灣時間約 03:37：同步全國法規資料庫的法條、勞動部政策法令公告
    - cron: '37 19 * * *'
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

concurrency:
  group: crawl
  cancel-in-progress: false

jobs:
  laws:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 安裝套件
        run: npm install --no-audit --no-fund
      - name: 讀取法規與法條原文
        run: node crawler/laws.js
      - name: 檢查法規資料（不合格就保留上一版、不發通知）
        run: |
          if ! node crawler/check-data.js --restore docs/laws.json; then
            rm -f data/changes.md
            echo "DATA_BAD=1" >> "$GITHUB_ENV"
          fi
      - name: 讀取勞動部政策法令公告
        run: |
          # 先記下法規那段通知，公告資料若沒通過檢查，只撤掉公告那段
          if [ -f data/changes.md ]; then cp data/changes.md "$RUNNER_TEMP/changes-laws.md"; fi
          node crawler/policy.js || true
      - name: 檢查公告資料（不合格就保留上一版、不發通知）
        run: |
          if ! node crawler/check-data.js --restore docs/policy.json; then
            if [ -f "$RUNNER_TEMP/changes-laws.md" ]; then cp "$RUNNER_TEMP/changes-laws.md" data/changes.md; else rm -f data/changes.md; fi
            echo "DATA_BAD=1" >> "$GITHUB_ENV"
          fi
      - name: 有變動就開 Issue 通知
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -s data/changes.md ]; then
            printf '\n---\n網站已自動顯示最新法條與公告，並在相關行業頁面標示「可能需更新」。確認後請修改 `docs/guides.json` 的內容與 `updated` 日期，提醒就會消失。\n' >> data/changes.md
            gh issue create --title "聘僱指南需確認：法規或公告有更新（$(TZ=Asia/Taipei date +'%Y-%m-%d')）" --body-file data/changes.md || echo "開 Issue 失敗（可能沒開啟 Issues 功能）"
            rm data/changes.md
          fi
      - name: 存回 GitHub
        run: |
          git config user.name "poster-bot"
          git config user.email "poster-bot@users.noreply.github.com"
          git add -A docs data/debug 2>/dev/null || git add -A docs
          if git diff --cached --quiet; then echo "沒有變更"; else
            git commit -m "法規與公告更新 $(TZ=Asia/Taipei date +'%Y-%m-%d')"
            git pull --rebase && git push
          fi

      - name: 有資料沒通過檢查就標成失敗（GitHub 會寄信通知）
        if: ${{ env.DATA_BAD == '1' }}
        run: |
          echo "有資料沒通過檢查，已保留上一版的資料，原因請看上面「檢查」步驟的說明。"
          exit 1
