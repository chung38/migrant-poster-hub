name: 更新熱門移工新聞

on:
  schedule:
    # 每 4 小時更新一次（台灣時間約 01:41、05:41、09:41、13:41、17:41、21:41）
    - cron: '41 1-23/4 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: crawl
  cancel-in-progress: false

jobs:
  news:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 安裝套件
        run: npm install --no-audit --no-fund
      - name: 抓新聞
        run: node crawler/news.js
      - name: 監看最低工資、就業安定費新公告
        run: node crawler/watch.js || true
      - name: 檢查資料格式（不合格就保留上一版）
        run: |
          node crawler/check-data.js --restore docs/news.json data/news-raw.json || echo "DATA_BAD=1" >> "$GITHUB_ENV"
          node crawler/check-data.js --restore docs/watch.json || echo "DATA_BAD=1" >> "$GITHUB_ENV"
      - name: 存回 GitHub
        run: |
          git config user.name "poster-bot"
          git config user.email "poster-bot@users.noreply.github.com"
          git add docs/news.json data/news-raw.json docs/watch.json
          if git diff --cached --quiet; then echo "沒有變更"; else
            git commit -m "新聞更新 $(TZ=Asia/Taipei date +'%m-%d %H:%M')"
            git pull --rebase && git push
          fi

      - name: 有資料沒通過檢查就標成失敗（GitHub 會寄信通知）
        if: ${{ env.DATA_BAD == '1' }}
        run: |
          echo "有資料沒通過檢查，已保留上一版的資料，原因請看上面「檢查」步驟的說明。"
          exit 1
