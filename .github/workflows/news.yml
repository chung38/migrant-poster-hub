name: 更新熱門移工新聞

on:
  schedule:
    # 每 4 小時更新一次（台灣時間約 01:41、05:41、09:41、13:41、17:41、21:41）
    - cron: '41 1-23/4 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: crawl
  cancel-in-progress: false

jobs:
  news:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 安裝套件
        run: npm install --no-audit --no-fund
      - name: 抓新聞
        run: node crawler/news.js
      - name: 存回 GitHub
        run: |
          git config user.name "poster-bot"
          git config user.email "poster-bot@users.noreply.github.com"
          git add docs/news.json data/news-raw.json
          if git diff --cached --quiet; then echo "沒有變更"; else
            git commit -m "新聞更新 $(TZ=Asia/Taipei date +'%m-%d %H:%M')"
            git pull --rebase && git push
          fi
