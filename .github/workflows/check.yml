name: 檢查手動修改的資料檔

# 在 GitHub 網頁上改了聘僱指南、電話、來源或分類，存檔後會自動檢查格式。
# 沒通過的話這個 Action 會變紅色並寄信，請照訊息修正（常見是少了逗號或引號）。
on:
  push:
    paths:
      - docs/guides.json
      - docs/info.json
      - sources.json
      - categories.json
      - crawler/check-data.js
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 檢查格式
        run: node crawler/check-data.js docs/guides.json docs/info.json sources.json categories.json
