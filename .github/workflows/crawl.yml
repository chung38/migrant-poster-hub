name: 每日抓取文宣

on:
  schedule:
    # 每天台灣時間早上 06:23（GitHub 用 UTC，所以寫 22:23）
    - cron: '23 22 * * *'
  workflow_dispatch: {}   # 可在 Actions 頁面按「Run workflow」手動執行

permissions:
  contents: write

concurrency:
  group: crawl
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 安裝套件
        run: npm install --no-audit --no-fund

      - name: 抓取並分類
        run: node crawler/crawl.js

      - name: 存回 GitHub
        run: |
          git config user.name "poster-bot"
          git config user.email "poster-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "今天沒有新文宣"
          else
            git commit -m "文宣更新 $(TZ=Asia/Taipei date +'%Y-%m-%d')"
            git push
          fi
