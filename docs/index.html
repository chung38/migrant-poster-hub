<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>移工宣導文宣資料庫</title>
<style>
  :root{
    --bg:#f6f3ec; --paper:#fffdf8; --ink:#1f2a2e; --muted:#6b7378; --line:#e4ddd0;
    --accent:#0f766e; --accent-soft:#d8efe9; --warn:#b45309; --bad:#b91c1c; --chip:#efe9dd;
    --radius:14px; --shadow:0 1px 2px rgba(0,0,0,.05),0 6px 18px rgba(31,42,46,.06);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font:15px/1.55 "Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif}
  a{color:var(--accent)}
  header{padding:28px 20px 8px;max-width:1180px;margin:0 auto}
  h1{margin:0;font-size:26px;letter-spacing:.02em}
  h1 small{font-size:13px;font-weight:400;color:var(--muted);margin-left:8px}
  .sub{color:var(--muted);font-size:13px;margin-top:4px}
  .bar{position:sticky;top:0;z-index:5;background:linear-gradient(var(--bg) 85%,transparent);padding:12px 20px 6px}
  .bar-in{max-width:1180px;margin:0 auto}
  .search{display:flex;gap:8px}
  .search input{flex:1;font:inherit;font-size:17px;padding:13px 16px;border:1.5px solid var(--line);
    border-radius:var(--radius);background:var(--paper);outline:none;box-shadow:var(--shadow)}
  .search input:focus{border-color:var(--accent)}
  .search button{font:inherit;border:0;border-radius:var(--radius);padding:0 16px;background:var(--chip);cursor:pointer}
  .filters{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;align-items:center}
  .chip{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:5px 11px;font-size:13px;cursor:pointer;
    white-space:nowrap;user-select:none}
  .chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
  .chip .n{opacity:.6;margin-left:3px}
  select.chip{appearance:none;padding-right:24px;background-image:linear-gradient(45deg,transparent 50%,#888 50%),linear-gradient(135deg,#888 50%,transparent 50%);
    background-position:calc(100% - 12px) 50%,calc(100% - 8px) 50%;background-size:4px 4px;background-repeat:no-repeat}
  .sep{width:1px;height:20px;background:var(--line);margin:0 4px}
  main{max-width:1180px;margin:0 auto;padding:4px 20px 60px}
  .hint{background:var(--accent-soft);border-radius:10px;padding:8px 12px;font-size:13px;margin:6px 0 14px}
  section.cat{margin:22px 0 8px}
  section.cat h2{font-size:18px;margin:0 0 10px;display:flex;align-items:baseline;gap:8px}
  section.cat h2 .n{font-size:13px;color:var(--muted);font-weight:400}
  section.cat h2 button{margin-left:auto;font:inherit;font-size:13px;border:0;background:none;color:var(--accent);cursor:pointer}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
  .card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--shadow)}
  .thumb{aspect-ratio:4/3;background:#ece6da;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}
  .thumb{text-decoration:none}
  .thumb img{width:100%;height:100%;object-fit:cover;object-position:top}
  .thumb .type{font-weight:700;font-size:22px;color:#8a7f6c;letter-spacing:.06em}
  .badge-new{position:absolute;top:8px;left:8px;background:var(--warn);color:#fff;font-size:11px;padding:2px 7px;border-radius:6px}
  .body{padding:10px 12px 12px;display:flex;flex-direction:column;gap:6px;flex:1}
  .title{font-weight:600;font-size:14.5px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
  .meta{font-size:12px;color:var(--muted)}
  .tags{display:flex;flex-wrap:wrap;gap:4px}
  .tag{font-size:11.5px;background:var(--chip);border-radius:6px;padding:1px 7px}
  .tag.lang{background:var(--accent-soft)}
  .actions{display:flex;gap:6px;margin-top:auto;padding-top:4px}
  .actions a{flex:1;text-align:center;font-size:13px;text-decoration:none;border-radius:9px;padding:7px 0;border:1px solid var(--line)}
  .actions a.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
  .empty{text-align:center;color:var(--muted);padding:60px 0}
  footer{max-width:1180px;margin:0 auto;padding:0 20px 40px;font-size:12.5px;color:var(--muted)}
  details summary{cursor:pointer}
  .src{display:flex;gap:8px;padding:3px 0;border-bottom:1px dashed var(--line)}
  .src .ok{color:var(--accent)} .src .bad{color:var(--bad)}
  mark{background:#fde68a;padding:0 1px;border-radius:2px}
  @media (max-width:520px){ .filters{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;scrollbar-width:none} .grid{grid-template-columns:repeat(2,1fr);gap:10px} h1{font-size:21px} .title{font-size:13.5px} }
</style>
</head>
<body>
<header>
  <h1>移工宣導文宣資料庫<small id="count"></small></h1>
  <div class="sub" id="updated">載入中…</div>
</header>

<div class="bar"><div class="bar-in">
  <form class="search" id="form">
    <input id="q" type="search" placeholder="搜尋：毒品、交通、詐騙、ma túy、narkoba…" autocomplete="off">
    <button type="button" id="clear" title="清除">✕</button>
  </form>
  <div class="filters" id="filters"></div>
</div></div>

<main id="out"></main>

<footer>
  <details><summary>各來源最近一次抓取狀態</summary><div id="report"></div></details>
</footer>

<script>
const LANG_NAMES = { vi:'越南', id:'印尼', th:'泰國', en:'英/菲', zh:'中文', multi:'多國語' };
const state = { q:'', cat:'', agency:'', lang:'', type:'', expanded:new Set() };
let DATA = { items:[], categories:[] };

const fold = s => String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'')
  .replace(/đ/g,'d').replace(/Đ/g,'D').toLowerCase().normalize('NFC');
const esc = s => String(s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

// 檔案一律連回政府網站原始位置；縮圖存在 docs/thumbs/
const fileHref = it => it.fileUrl;
const isImg = it => ['jpg','jpeg','png','gif','webp'].includes(it.ext);
const typeOf = it => isImg(it) ? 'img' : it.ext === 'pdf' ? 'pdf' : 'other';

/** 找出這次搜尋「連帶」的類別：輸入 毒品 → 反毒類（裡面有越南文、印尼文的同義字） */
function relatedCats(q){
  const fq = fold(q);
  if (!fq) return [];
  return DATA.categories.filter(c =>
    fold(c.name).includes(fq) || c.keywords.some(k => { const fk = fold(k); return fk === fq || (fq.length >= 2 && fk.includes(fq)) || (fk.length >= 2 && fq.includes(fk)); })
  ).map(c => c.name);
}

function score(it, terms, cats){
  if (!terms.length) return 1;
  const hay = fold([it.title, it.snippet, it.agency, it.sourceName, it.categories.join(' '), (it.langs||[]).map(l=>LANG_NAMES[l]).join(' ')].join(' '));
  // 所有關鍵字都要出現（AND），或是屬於搜尋帶出的類別
  const title = fold(it.title);
  let s = 0;
  if (terms.every(t => title.includes(t))) s += 6;
  else if (terms.every(t => hay.includes(t))) s += 3;
  if (it.categories.some(c => cats.includes(c))) s += 4;
  return s;
}

function filtered(){
  const terms = fold(state.q).split(/\s+/).filter(Boolean);
  const cats = relatedCats(state.q);
  return DATA.items
    .filter(it => !state.cat || it.categories.includes(state.cat))
    .filter(it => !state.agency || it.agency === state.agency)
    .filter(it => !state.lang || (it.langs||[]).includes(state.lang))
    .filter(it => !state.type || typeOf(it) === state.type)
    .map(it => ({ it, s: score(it, terms, cats) }))
    .filter(x => x.s > 0)
    .sort((a,b) => b.s - a.s || (b.it.date||b.it.addedAt).localeCompare(a.it.date||a.it.addedAt))
    .map(x => x.it);
}

function hl(text){
  const terms = state.q.trim().split(/\s+/).filter(Boolean);
  let h = esc(text);
  for (const t of terms){
    const re = new RegExp(esc(t).replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi');
    h = h.replace(re, m => `<mark>${m}</mark>`);
  }
  return h;
}

function card(it){
  const isNew = Date.now() - new Date(it.addedAt).getTime() < 7*864e5;
  const typeLabel = `<span class="type">${esc((it.ext||'file').toUpperCase())}</span>`;
  const thumb = it.thumb
    ? `<img loading="lazy" src="${esc(it.thumb)}" alt="" onerror="this.outerHTML='${typeLabel.replace(/"/g,'&quot;')}'">`
    : typeLabel;
  const size = it.size ? ` · ${(it.size/1048576).toFixed(it.size>1048576?1:2)}MB` : '';
  return `<article class="card">
    <a class="thumb" href="${esc(fileHref(it))}" target="_blank" rel="noopener">${thumb}${isNew?'<span class="badge-new">NEW</span>':''}</a>
    <div class="body">
      <div class="title" title="${esc(it.title)}">${hl(it.title)}</div>
      <div class="meta">${esc(it.agency)} · ${esc(it.date || it.addedAt.slice(0,10))}${size}</div>
      <div class="tags">
        ${(it.langs||[]).map(l=>`<span class="tag lang">${esc(LANG_NAMES[l]||l)}</span>`).join('')}
        ${it.categories.slice(0,3).map(c=>`<span class="tag">${esc(c)}</span>`).join('')}
      </div>
      <div class="actions">
        <a class="primary" href="${esc(fileHref(it))}" target="_blank" rel="noopener">開啟檔案</a>
        <a href="${esc(it.sourcePage)}" target="_blank" rel="noopener">原網頁</a>
      </div>
    </div></article>`;
}

function renderFilters(){
  const count = (fn) => DATA.items.filter(fn).length;
  const catChips = DATA.categories.map(c => {
    const n = count(it => it.categories.includes(c.name));
    if (!n) return '';
    return `<span class="chip" data-k="cat" data-v="${esc(c.name)}" aria-pressed="${state.cat===c.name}">${c.icon||''} ${esc(c.name)}<span class="n">${n}</span></span>`;
  }).join('');
  const agencies = [...new Set(DATA.items.map(i=>i.agency))].sort();
  const langs = Object.keys(LANG_NAMES).filter(l => count(it => (it.langs||[]).includes(l)));
  document.getElementById('filters').innerHTML = catChips
    + `<span class="sep"></span>`
    + langs.map(l=>`<span class="chip" data-k="lang" data-v="${l}" aria-pressed="${state.lang===l}">${LANG_NAMES[l]}</span>`).join('')
    + `<span class="sep"></span>`
    + [['img','圖片'],['pdf','PDF'],['other','其他檔']].map(([v,t])=>`<span class="chip" data-k="type" data-v="${v}" aria-pressed="${state.type===v}">${t}</span>`).join('')
    + `<select class="chip" id="agency"><option value="">全部機關</option>${agencies.map(a=>`<option ${state.agency===a?'selected':''}>${esc(a)}</option>`).join('')}</select>`;
  document.getElementById('agency').onchange = e => { state.agency = e.target.value; update(); };
}

function render(){
  const list = filtered();
  const out = document.getElementById('out');
  const searching = state.q.trim() || state.cat || state.agency || state.lang || state.type;
  if (!DATA.items.length){
    out.innerHTML = `<div class="empty">還沒有資料。第一次排程跑完後就會出現（GitHub → Actions → 每日抓取文宣 → Run workflow 可以馬上跑）。</div>`;
    return;
  }
  if (!list.length){ out.innerHTML = `<div class="empty">找不到「${esc(state.q)}」相關文宣，換個關鍵字試試</div>`; return; }

  let html = '';
  const rc = relatedCats(state.q);
  if (state.q.trim() && rc.length){
    const kw = DATA.categories.filter(c=>rc.includes(c.name)).flatMap(c=>c.keywords).filter(k=>!/[一-鿿]|^\d+$/.test(k)).slice(0,6);
    html += `<div class="hint">「${esc(state.q)}」同時帶出類別：<b>${rc.map(esc).join('、')}</b>${kw.length?`（含外語文宣，如 ${kw.map(esc).join('、')}）`:''}　共 ${list.length} 筆</div>`;
  }
  if (searching){
    html += `<div class="grid">${list.slice(0,300).map(card).join('')}</div>`;
    if (list.length > 300) html += `<p class="empty">只顯示前 300 筆，請加關鍵字縮小範圍</p>`;
  } else {
    // 沒有搜尋時：依類別分區顯示（同一類放在一起）
    const groups = new Map();
    for (const it of list){ const c = it.primaryCategory; if(!groups.has(c)) groups.set(c,[]); groups.get(c).push(it); }
    const order = DATA.categories.map(c=>c.name);
    for (const name of [...groups.keys()].sort((a,b)=>order.indexOf(a)-order.indexOf(b))){
      const arr = groups.get(name);
      const icon = (DATA.categories.find(c=>c.name===name)||{}).icon||'';
      const open = state.expanded.has(name);
      html += `<section class="cat"><h2>${icon} ${esc(name)}<span class="n">${arr.length} 筆</span>
        ${arr.length>8?`<button data-expand="${esc(name)}">${open?'收合':'看全部'}</button>`:''}</h2>
        <div class="grid">${(open?arr:arr.slice(0,8)).map(card).join('')}</div></section>`;
    }
  }
  out.innerHTML = html;
}

function update(pushHash=true){
  renderFilters(); render();
  if (pushHash){
    const p = new URLSearchParams();
    for (const k of ['q','cat','agency','lang','type']) if (state[k]) p.set(k, state[k]);
    history.replaceState(null,'', p.toString() ? `#${p}` : location.pathname);
  }
}

function renderReport(rep){
  if (!rep?.sources) return;
  document.getElementById('report').innerHTML = `<p>最近一次：${new Date(rep.finishedAt).toLocaleString('zh-TW')}</p>` +
    rep.sources.map(s=>`<div class="src"><span class="${s.ok&&!s.errors.length?'ok':s.ok?'':'bad'}">${s.ok? (s.errors.length?'⚠':'✔') : '✘'}</span>
      <span><b>${esc(s.agency)}</b> ${esc(s.name)}：新增 ${s.newCount} 筆${s.errors.length?`<br><small>${s.errors.slice(0,3).map(esc).join('<br>')}</small>`:''}</span></div>`).join('');
}

document.addEventListener('click', e => {
  const chip = e.target.closest('.chip[data-k]');
  if (chip){ const k = chip.dataset.k, v = chip.dataset.v; state[k] = state[k]===v ? '' : v; update(); return; }
  const ex = e.target.closest('[data-expand]');
  if (ex){ const n = ex.dataset.expand; state.expanded.has(n)?state.expanded.delete(n):state.expanded.add(n); render(); }
});
let t;
document.getElementById('q').addEventListener('input', e => { clearTimeout(t); t = setTimeout(()=>{ state.q = e.target.value; update(); }, 180); });
document.getElementById('form').addEventListener('submit', e => e.preventDefault());
document.getElementById('clear').onclick = () => { Object.assign(state,{q:'',cat:'',agency:'',lang:'',type:''}); document.getElementById('q').value=''; update(); };

(async () => {
  try {
    const r = await fetch('catalog.json?'+Date.now()); DATA = await r.json();
    DATA.items ||= []; DATA.categories ||= [];
  } catch { DATA = { items:[], categories:[] }; }
  const p = new URLSearchParams(location.hash.slice(1));
  for (const k of ['q','cat','agency','lang','type']) state[k] = p.get(k) || '';
  document.getElementById('q').value = state.q;
  document.getElementById('count').textContent = DATA.items.length ? `共 ${DATA.items.length} 份` : '';
  document.getElementById('updated').textContent = DATA.updatedAt ? `每天自動更新，最後更新：${new Date(DATA.updatedAt).toLocaleString('zh-TW')}` : '尚未更新';
  update(false);
  fetch('report.json?'+Date.now()).then(r=>r.json()).then(renderReport).catch(()=>{});
})();
</script>
</body>
</html>
