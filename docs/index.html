<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>移次搞定｜移工文宣・新聞一次找齊</title>
<meta name="description" content="移次搞定：各政府機關移工宣導文宣（中、越、印、泰、英）、熱門移工新聞、求助專線，一次找齊。">
<meta name="theme-color" content="#f6f3ec">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2224%22 fill=%22%230f766e%22/><text x=%2250%22 y=%2270%22 font-size=%2260%22 text-anchor=%22middle%22 fill=%22white%22 font-family=%22sans-serif%22 font-weight=%22900%22>移</text></svg>">
<style>
  :root{
    --bg:#f6f3ec; --paper:#fffdf8; --ink:#1f2a2e; --muted:#6b7378; --line:#e4ddd0;
    --accent:#0f766e; --accent-soft:#d8efe9; --warn:#b45309; --sun:#f59e0b; --bad:#b91c1c; --chip:#efe9dd;
    --radius:14px; --shadow:0 1px 2px rgba(0,0,0,.05),0 6px 18px rgba(31,42,46,.06);
    --tabbar:64px;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--bg);color:var(--ink);padding-bottom:calc(var(--tabbar) + 24px + env(safe-area-inset-bottom));
    font:15px/1.55 "Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif}
  a{color:var(--accent)}
  button{font:inherit;color:inherit}
  .wrap{max-width:1100px;margin:0 auto;padding:0 16px}

  /* 頂部 */
  header{padding:18px 0 4px}
  .top{display:flex;align-items:center;gap:10px}
  .brand{display:inline-flex;align-items:center;gap:10px;font-weight:900;font-size:24px;letter-spacing:.04em;text-decoration:none;color:var(--ink)}
  .brand em{font-style:normal;background:linear-gradient(90deg,var(--accent),var(--sun));-webkit-background-clip:text;background-clip:text;color:transparent}
  .logo{width:34px;height:34px;border-radius:10px;background:var(--accent);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:20px;transform:rotate(-6deg);box-shadow:3px 3px 0 var(--sun)}
  .top small{margin-left:auto;font-size:12px;color:var(--muted);text-align:right;line-height:1.3}
  .tagline{font-size:13.5px;font-weight:600;margin:6px 0 0}

  .bar{position:sticky;top:0;z-index:5;background:linear-gradient(var(--bg) 82%,transparent);padding:10px 0 8px}
  .search{display:flex;gap:8px}
  .search input{flex:1;min-width:0;font:inherit;font-size:16px;padding:12px 15px;border:1.5px solid var(--line);
    border-radius:var(--radius);background:var(--paper);outline:none;box-shadow:var(--shadow)}
  .search input:focus{border-color:var(--accent)}
  .search input::-webkit-search-cancel-button{display:none}
  main [id]{scroll-margin-top:80px}
  .search button{border:0;border-radius:var(--radius);padding:0 15px;background:var(--chip);cursor:pointer}

  /* 篩選 */
  .filters{display:flex;gap:6px;margin-top:10px;align-items:center;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
  .filters::-webkit-scrollbar{display:none}
  .filters[hidden],[hidden]{display:none!important}
  .chip{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:5px 11px;font-size:13px;cursor:pointer;white-space:nowrap;user-select:none}
  .chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
  .chip .n{opacity:.6;margin-left:3px}
  select.chip{appearance:none;padding-right:24px;background-image:linear-gradient(45deg,transparent 50%,#888 50%),linear-gradient(135deg,#888 50%,transparent 50%);
    background-position:calc(100% - 12px) 50%,calc(100% - 8px) 50%;background-size:4px 4px;background-repeat:no-repeat}
  .sep{flex:none;width:1px;height:20px;background:var(--line);margin:0 2px}

  /* 區塊 */
  section.blk{margin:22px 0 6px}
  .blk h2{font-size:18px;margin:0 0 10px;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
  .blk h2 .n{font-size:12.5px;color:var(--muted);font-weight:400}
  .blk h2 .go{margin-left:auto;font-size:13px;font-weight:500;border:0;background:none;color:var(--accent);cursor:pointer;padding:0}
  .hint{background:var(--accent-soft);border-radius:10px;padding:8px 12px;font-size:13px;margin:6px 0 12px}
  .empty{text-align:center;color:var(--muted);padding:50px 10px}


  /* 內容區塊：依類型上色，文宣／聘僱／新聞／工具一眼分開 */
  .pn{background:var(--paper);border:1px solid var(--line);border-top:4px solid var(--k);border-radius:var(--radius);box-shadow:var(--shadow);padding:12px 14px 14px;margin:16px 0}
  .pn h2{font-size:17px;margin:0 0 10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .pn h2 .n,.pagehead .n{font-size:12.5px;color:var(--muted);font-weight:400}
  .kind{flex:none;font-size:11px;font-weight:700;color:#fff;background:var(--k);border-radius:6px;padding:2px 7px;letter-spacing:.05em}
  .go{margin-left:auto;font-size:13px;font-weight:600;border:0;background:none;color:var(--k,var(--accent));cursor:pointer;padding:0}
  h3.sub{font-size:14px;margin:16px 0 8px;display:flex;align-items:center;gap:6px}
  .pn h2 + h3.sub{margin-top:0}
  .pn .list,.pn .newslist{border:0;border-radius:0;box-shadow:none;margin:0 -14px;background:none}
  .pn .card{box-shadow:none;background:#fff}
  .pn .steps + .list{margin-top:6px}
  .lead{font-size:13px;color:var(--muted);margin:0 0 10px}
  .pagehead{--k:var(--accent);display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:16px 0 6px;font-size:17px}
  .pagehead .back{border:0;background:var(--chip);width:32px;height:32px;border-radius:50%;font-size:22px;line-height:1;cursor:pointer;padding:0 0 3px}

  /* 首頁快速選單 */
  .menu{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
  .mi{display:flex;flex-direction:column;align-items:center;gap:1px;padding:12px 2px 10px;border:0;border-radius:16px;background:var(--k);color:#fff;cursor:pointer;box-shadow:var(--shadow)}
  .mi b{font-size:26px;line-height:1.15}
  .mi span{font-size:13px;font-weight:700}
  .mi small{font-size:11px;opacity:.85}
  .mi:active,.tile:active,.ind:active,.indcard:active{transform:scale(.97)}

  /* 聘僱 */
  .inds{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  .ind{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 2px;background:#fff;border:1px solid #dcdcf7;border-radius:12px;cursor:pointer}
  .ind b{font-size:24px;line-height:1.15}
  .ind span{font-size:12.5px;font-weight:600;line-height:1.25;text-align:center}
  .indlist{display:grid;gap:8px}
  @media (min-width:700px){ .indlist{grid-template-columns:1fr 1fr} .inds{grid-template-columns:repeat(8,1fr)} }
  .indcard{display:flex;align-items:center;gap:12px;text-align:left;padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:#fff;cursor:pointer}
  .indcard b{font-size:28px;line-height:1}
  .indcard span{flex:1;min-width:0;display:flex;flex-direction:column}
  .indcard small{color:var(--muted);font-size:12.5px;line-height:1.4}
  .indcard i{font-style:normal;color:var(--k);font-size:22px}
  ul.pts{margin:0;padding-left:20px}
  ul.pts li{margin:5px 0;font-size:14px}
  ol.steps{list-style:none;counter-reset:s;margin:0;padding:0}
  ol.steps li{counter-increment:s;position:relative;padding:0 0 14px 40px}
  ol.steps li::before{content:counter(s);position:absolute;left:0;top:0;width:28px;height:28px;border-radius:50%;background:var(--k);color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;font-size:13px}
  ol.steps li::after{content:"";position:absolute;left:13px;top:31px;bottom:3px;width:2px;background:var(--line)}
  ol.steps li:last-child{padding-bottom:0}
  ol.steps li:last-child::after{display:none}
  ol.steps b{display:block;line-height:1.5}
  ol.steps span{display:block;font-size:13.5px;color:#3d4a50}
  .newb{display:inline-block;font-size:11px;font-weight:700;background:#e11d48;color:#fff;border-radius:6px;padding:0 6px;margin-left:4px;vertical-align:1px}

  .auto{margin-left:auto;font-size:11.5px;font-weight:600;color:#047857;background:#d1fae5;border-radius:999px;padding:2px 8px}
  .notice.stale{background:#fff7ed;border-color:#fdba74;margin-top:10px}
  .notice.stale span{display:block;font-size:12.5px;line-height:1.5;padding:2px 0}
  .notice.stale small{margin-top:4px;color:#9a3412;font-weight:600}
  .lawpart{margin:0 0 12px}
  .lawpart > b{display:block;font-size:14px;line-height:1.45}
  .lawpart > small{display:block;color:var(--muted);font-size:12px;margin-bottom:6px}
  details.art{border:1px solid var(--line);border-radius:10px;margin-top:6px;background:#fff}
  details.art summary{list-style:none;cursor:pointer;padding:9px 12px;display:flex;gap:8px;align-items:baseline;font-size:13.5px}
  details.art summary::-webkit-details-marker{display:none}
  details.art summary b{flex:none;color:var(--k)}
  details.art summary span{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
  details.art[open] summary span{display:none}
  .atext{padding:0 12px 11px;font-size:13.5px;line-height:1.7;color:#2d3a40}
  .lawlink{display:inline-block;margin-top:8px;font-size:12.5px;color:var(--k);text-decoration:none;font-weight:600}


  /* 東南亞華文媒體 */
  .seac{padding:10px 0;border-top:1px solid var(--line)}
  .seac:first-of-type{border-top:0;padding-top:0}
  .seah{display:flex;align-items:center;gap:6px;margin-bottom:2px}
  .seah .flag{font-size:20px}
  .seah a{margin-left:auto;font-size:12px;color:var(--muted);text-decoration:none}
  .sealist{margin:0;padding-left:22px}
  .sealist li{margin:7px 0;font-size:14.5px;line-height:1.45}
  .sealist a,.seamini a{color:var(--ink);text-decoration:none;font-weight:600}
  .sealist small,.seamini small{display:block;color:var(--muted);font-size:12px;font-weight:400;margin-top:1px}
  .hlb{display:inline-block;font-size:11px;font-weight:700;color:#475569;background:#e2e8f0;border-radius:6px;padding:0 6px;margin-right:6px;vertical-align:1px}
  .seamini{list-style:none;margin:0;padding:0}
  .seamini li{display:flex;gap:8px;align-items:flex-start;padding:7px 0;border-top:1px solid var(--line);font-size:14px;line-height:1.45}
  .seamini li:first-child{border-top:0}
  .seamini .flag{font-size:18px;line-height:1.3}


  /* 應備文件清單 */
  .ckbar{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:2px}
  .ckn{font-size:13px;color:var(--muted);margin-right:auto}
  .ckn b{color:var(--k);font-size:15px}
  .mini{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 11px;font-size:12.5px;font-weight:600;cursor:pointer;color:var(--ink)}
  .mini.line{background:#06c755;border-color:#06c755;color:#fff}
  .cks{display:grid;gap:6px}
  .ck{display:flex;gap:10px;align-items:flex-start;padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:#fff;cursor:pointer}
  .ck input{width:20px;height:20px;margin:1px 0 0;flex:none;accent-color:var(--k)}
  .ck b{display:block;font-size:14px;font-weight:600;line-height:1.45}
  .ck small{display:block;font-size:12.5px;color:var(--muted);line-height:1.55;margin-top:2px}
  .ck:has(input:checked){background:#f1f5f9;border-color:#e2e8f0}
  .ck:has(input:checked) b{text-decoration:line-through;color:var(--muted)}

  /* 工具箱 */
  .jump{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:6px 0 0}
  .jump::-webkit-scrollbar{display:none}
  .jump a,.jump button{flex:none;border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:6px 12px;font-size:13px;text-decoration:none;color:var(--ink);cursor:pointer}
  .btnli{width:100%;border:0;border-top:1px solid var(--line);background:none;text-align:left;cursor:pointer}
  .chip.fav[aria-pressed="true"]{background:#e11d48;border-color:#e11d48}

  /* 本月宣導 */
  .season{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
  .pill{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:4px 10px;font-size:12.5px;background:#fff4dd;border:1px solid #f7d58a;cursor:pointer}
  .pill.ev{background:var(--accent-soft);border-color:#a7d8cd}

  /* 橫向捲動 */
  .row{display:grid;grid-auto-flow:column;grid-auto-columns:158px;gap:10px;overflow-x:auto;padding:2px 2px 8px;scroll-snap-type:x mandatory;scrollbar-width:none}
  .row::-webkit-scrollbar{display:none}
  .row .card{scroll-snap-align:start}
  .row .actions{display:none}
  .row .title{-webkit-line-clamp:2;font-size:13px}

  /* 主題方塊 */
  .tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  .tile{display:flex;flex-direction:column;align-items:center;gap:2px;padding:12px 4px 10px;background:var(--paper);border:1px solid var(--line);border-radius:14px;cursor:pointer;text-align:center}
  .tile b{font-size:24px;line-height:1.1}
  .tile span{font-size:12.5px;font-weight:600;line-height:1.25}
  .tile small{font-size:11px;color:var(--muted)}

  /* 專線 */
  .calls{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  .call{display:flex;flex-direction:column;align-items:center;padding:10px 4px;border-radius:14px;background:var(--accent);color:#fff;text-decoration:none;box-shadow:var(--shadow)}
  .call b{font-size:20px;letter-spacing:.02em}
  .call span{font-size:11.5px;opacity:.9;text-align:center;line-height:1.25}
  .call.red{background:var(--bad)} .call.orange{background:var(--warn)}
  .list{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
  .li{display:flex;gap:12px;align-items:center;padding:12px 14px;border-top:1px solid var(--line);text-decoration:none;color:inherit}
  .li:first-child{border-top:0}
  .li .ic{font-size:24px;flex:none;width:32px;text-align:center}
  .li .tx{flex:1;min-width:0}
  .li .tx b{display:block;font-size:14.5px}
  .li .tx small{display:block;color:var(--muted);font-size:12.5px;line-height:1.45}
  .li .no{flex:none;font-weight:800;color:var(--accent);font-size:15px;white-space:nowrap}
  table.nums{width:100%;border-collapse:collapse;font-size:14px}
  .nums th{text-align:left;font-size:12.5px;color:var(--muted);font-weight:600;padding:12px 14px 4px;background:var(--bg)}
  .nums td{padding:9px 14px;border-top:1px solid var(--line);vertical-align:top}
  .nums td.v{font-weight:800;white-space:nowrap;color:var(--accent);text-align:right}
  .nums small{display:block;color:var(--muted);font-size:12px;line-height:1.4}
  .src-note{font-size:12px;color:var(--muted);margin:8px 2px 0}

  /* 卡片 */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
  .card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--shadow)}
  .thumb{aspect-ratio:4/3;background:#ece6da;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative;text-decoration:none;border:0;padding:0;width:100%;cursor:pointer}
  .thumb img{width:100%;height:100%;object-fit:cover;object-position:top}
  .thumb .type{font-weight:700;font-size:22px;color:#8a7f6c;letter-spacing:.06em}
  .badge-new{position:absolute;top:8px;left:8px;background:var(--warn);color:#fff;font-size:11px;padding:2px 7px;border-radius:6px}
  .badge-count{position:absolute;right:8px;bottom:8px;background:rgba(31,42,46,.82);color:#fff;font-size:11.5px;padding:3px 8px;border-radius:999px}
  .body{padding:9px 11px 11px;display:flex;flex-direction:column;gap:5px;flex:1}
  .title{font-weight:600;font-size:14px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
  .meta{font-size:12px;color:var(--muted)}
  .langs{font-size:15px;letter-spacing:1px}
  .tag{font-size:11.5px;background:var(--chip);border-radius:6px;padding:1px 7px;align-self:flex-start}
  .actions{display:flex;gap:6px;margin-top:auto;padding-top:4px}
  .actions .primary{flex:1;text-align:center;font-size:13px;text-decoration:none;border-radius:9px;padding:7px 0;background:var(--accent);color:#fff;border:0;cursor:pointer}
  .ib{flex:none;width:34px;border:1px solid var(--line);background:var(--paper);border-radius:9px;cursor:pointer;font-size:15px;display:flex;align-items:center;justify-content:center;text-decoration:none}
  .ib.on{color:#e11d48;border-color:#fecdd3;background:#fff1f2}
  .ib.line{color:#06c755;font-weight:800;font-size:11px}
  mark{background:#fde68a;padding:0 1px;border-radius:2px}
  .more{text-align:center;margin:16px 0 4px}
  .more button{font-size:14px;border:1px solid var(--line);background:var(--paper);color:var(--accent);border-radius:999px;padding:9px 22px;cursor:pointer}

  /* 新聞 */
  .newslist{list-style:none;margin:0;padding:0;background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
  .newslist li{display:flex;gap:12px;padding:12px 14px;border-top:1px solid var(--line)}
  .newslist li:first-child{border-top:0}
  .rank{flex:none;width:26px;height:26px;border-radius:8px;background:var(--chip);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;color:var(--muted)}
  .newslist li:nth-child(-n+3) .rank{background:var(--warn);color:#fff}
  .nbody{flex:1;min-width:0}
  .ntitle{color:var(--ink);text-decoration:none;font-weight:600;line-height:1.45}
  .nmeta{font-size:12px;color:var(--muted);margin-top:3px}
  .ncount{color:var(--warn);font-weight:600}
  .nbody details{font-size:12.5px;margin-top:4px}
  .nbody summary{color:var(--accent);cursor:pointer}
  .nbody details a{display:block;color:var(--muted);text-decoration:none;padding:3px 0}

  /* 行事曆 */
  .ev-date{flex:none;width:52px;text-align:center;border-radius:10px;background:var(--accent-soft);padding:4px 0;line-height:1.15}
  .ev-date b{display:block;font-size:17px;color:var(--accent)}
  .ev-date small{font-size:11px;color:var(--muted)}
  .months{display:grid;grid-template-columns:repeat(12,1fr);gap:2px;margin-top:6px}
  .months i{height:6px;border-radius:3px;background:var(--chip)}
  .months i.on{background:var(--sun)}
  .months i.now{outline:2px solid var(--ink);outline-offset:1px}

  /* 底部分頁列 */
  nav.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:15;background:rgba(255,253,248,.96);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
    border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
  .tabs{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);height:var(--tabbar)}
  .tab{border:0;background:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;color:var(--muted);font-size:11.5px;position:relative}
  .tab b{font-size:21px;line-height:1;filter:grayscale(1);opacity:.7}
  .tab[aria-current="page"]{color:var(--accent);font-weight:700}
  .tab[aria-current="page"] b{filter:none;opacity:1}
  .tab[aria-current="page"]::before{content:"";position:absolute;top:0;left:30%;right:30%;height:3px;border-radius:0 0 3px 3px;background:var(--accent)}
  .tab .dot{position:absolute;top:8px;left:calc(50% + 8px);min-width:16px;height:16px;border-radius:8px;background:#e11d48;color:#fff;font-size:10px;line-height:16px;padding:0 4px;font-weight:700}

  /* 版本選單 */
  .sheet{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center}
  .sheet[hidden]{display:none}
  .sheet .backdrop{position:absolute;inset:0;background:rgba(20,25,28,.45)}
  .sheet .panel{position:relative;background:var(--paper);width:min(560px,100%);max-height:85vh;overflow:auto;
    border-radius:18px 18px 0 0;padding:18px 18px calc(24px + env(safe-area-inset-bottom));box-shadow:0 -10px 30px rgba(0,0,0,.18);animation:up .18s ease-out}
  @media (min-width:700px){ .sheet{align-items:center} .sheet .panel{border-radius:18px} }
  @keyframes up{from{transform:translateY(30px);opacity:.5}to{transform:none;opacity:1}}
  .panel h3{margin:0 34px 4px 0;font-size:17px;line-height:1.4}
  .panel .x{position:absolute;top:12px;right:12px;border:0;background:var(--chip);width:32px;height:32px;border-radius:50%;font-size:16px;cursor:pointer}
  .panel .pm{font-size:12.5px;color:var(--muted);margin-bottom:10px}
  .panel .pa{display:flex;gap:8px;margin-bottom:6px}
  .panel .pa .ib{width:auto;padding:6px 12px;font-size:13px;gap:4px}
  .ver{display:flex;align-items:center;gap:12px;padding:10px;border:1px solid var(--line);border-radius:12px;margin-top:8px;text-decoration:none;color:inherit}
  .ver:active,.ver:hover{border-color:var(--accent);background:#f3faf8}
  .vthumb{width:64px;height:64px;flex:none;border-radius:8px;overflow:hidden;background:#ece6da;display:flex;align-items:center;justify-content:center}
  .vthumb img{width:100%;height:100%;object-fit:cover;object-position:top}
  .vthumb .type{font-size:12px}
  .vinfo{flex:1;display:flex;flex-direction:column}
  .vinfo small{color:var(--muted);font-size:12px}
  .vgo{color:var(--accent);font-size:14px;white-space:nowrap}

  .toast{position:fixed;left:50%;bottom:calc(var(--tabbar) + 18px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:#fff;padding:8px 16px;border-radius:999px;font-size:13px;z-index:30;opacity:0;transition:opacity .2s;pointer-events:none}
  .toast.show{opacity:1}
  footer{font-size:12.5px;color:var(--muted);margin-top:28px}
  footer details summary{cursor:pointer}
  .src{display:flex;gap:8px;padding:3px 0;border-bottom:1px dashed var(--line)}
  .src .ok{color:var(--accent)} .src .bad{color:var(--bad)}

  @media (max-width:520px){
    .grid{grid-template-columns:repeat(2,1fr);gap:10px}
    .title{font-size:13.5px}
    .brand{font-size:22px}
  }
  @media (min-width:900px){ .tiles{grid-template-columns:repeat(7,1fr)} .calls{grid-template-columns:repeat(4,180px)} }
  .notice{background:#fff4dd;border:1px solid #f7d58a;border-radius:12px;padding:10px 12px;margin-bottom:10px;font-size:13px}
  .notice b{display:block;margin-bottom:4px}
  .notice a{display:block;color:var(--ink);text-decoration:none;padding:4px 0;border-top:1px dashed #f0d79a}
  .notice small{display:block;color:var(--muted);font-size:11.5px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="top">
      <a class="brand" href="#" data-tab="home"><span class="logo">移</span><span>移次<em>搞定</em></span></a>
      <small id="updated"></small>
    </div>
    <p class="tagline">移工文宣・聘僱指南・新聞・專線，一次找齊 ✌️</p>
  </header>

  <div class="bar">
    <form class="search" id="form" role="search">
      <input id="q" type="search" placeholder="全站搜尋：毒品、製造業、看護、1955…" autocomplete="off" enterkeyhint="search">
      <button type="button" id="clear" title="清除">✕</button>
    </form>
    <div class="filters" id="filters" hidden></div>
  </div>

  <main id="out"></main>

  <footer id="foot" hidden>
    <details><summary>各來源最近一次抓取狀態</summary><div id="report"></div></details>
  </footer>
</div>

<nav class="tabbar" aria-label="主要分頁">
  <div class="tabs">
    <button class="tab" data-tab="home"><b>🏠</b>首頁</button>
    <button class="tab" data-tab="posters"><b>🗂️</b>文宣</button>
    <button class="tab" data-tab="hire"><b>📋</b>聘僱</button>
    <button class="tab" data-tab="news"><b>📰</b>新聞</button>
    <button class="tab" data-tab="tools"><b>🧰</b>工具箱<span class="dot" id="toolsdot" hidden>!</span></button>
  </div>
</nav>

<div class="sheet" id="sheet" hidden>
  <div class="backdrop" data-close></div>
  <div class="panel" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
    <button class="x" data-close aria-label="關閉">✕</button>
    <h3 id="sheet-title"></h3>
    <div class="pm" id="sheet-meta"></div>
    <div class="pa" id="sheet-actions"></div>
    <div id="sheet-list"></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
const LANG_NAMES = { zh:'中文', vi:'越南', id:'印尼', th:'泰國', en:'英/菲', multi:'多國語' };
const FLAGS = { zh:'🇹🇼', vi:'🇻🇳', id:'🇮🇩', th:'🇹🇭', en:'🇵🇭', multi:'🌐' };
const LANG_ORDER = ['zh','vi','id','th','en','multi'];
const FILTER_KEYS = ['q','cat','agency','lang','type','fav'];
const PAGE = 30;
const state = { tab:'home', q:'', cat:'', agency:'', lang:'', type:'', fav:'', guide:'', limit:PAGE };
let DATA = { items:[], categories:[] }, GROUPS = [], NEWS = null, INFO = null, WATCH = null, GUIDES = null, LAWS = null, POLICY = null, SEA = null;

const fold = s => String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/đ/g,'d').replace(/Đ/g,'D').toLowerCase().normalize('NFC');
const esc = s => String(s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const isImg = it => ['jpg','jpeg','png','gif','webp'].includes(it.ext);
const typeOf = it => isImg(it) ? 'img' : it.ext === 'pdf' ? 'pdf' : 'other';
const dateOf = it => it.date || (it.addedAt||'').slice(0,10);
const hasFilter = () => FILTER_KEYS.some(k => state[k]);
const catIcon = name => (DATA.categories.find(c => c.name === name) || {}).icon || '📁';

// ---------- 收藏（存在這支手機的瀏覽器裡） ----------
let FAV = [];
try { FAV = JSON.parse(localStorage.getItem('yici-fav') || '[]'); } catch { FAV = []; }
function saveFav(){ try { localStorage.setItem('yici-fav', JSON.stringify(FAV)); } catch {} updateFavDot(); }
const isFav = gid => FAV.includes(gid);
function toggleFav(gid){ FAV = isFav(gid) ? FAV.filter(x => x !== gid) : [gid, ...FAV]; saveFav(); toast(isFav(gid) ? '已加入收藏 ❤️' : '已取消收藏'); }
function updateFavDot(){}

// ---------- 把各語言版本合成一組 ----------
function baseTitle(t){ return String(t).split('－')[0].trim(); }
const LABEL_LANG = [[/中文|華語|國語/,'zh'],[/越南|越文|tiếng việt/i,'vi'],[/印尼|indonesia/i,'id'],[/泰/,'th'],[/英文|英語|菲律賓|english|tagalog/i,'en']];
function effLangs(it){
  const label = String(it.title).split('－').slice(1).join('－');
  const hit = LABEL_LANG.find(([re]) => re.test(label));
  return hit ? [hit[1]] : (it.langs||[]);
}
function langRank(it){ const l = effLangs(it).find(x => x !== 'multi') || 'multi'; const r = LANG_ORDER.indexOf(l); return r < 0 ? 99 : r; }
function versionLabel(it){
  if (it.version) return it.version;
  const suffix = String(it.title).split('－').slice(1).join('－').trim();
  if (suffix) return suffix;
  const l = (it.langs||[]).filter(x => x !== 'multi');
  if (l.length === 1) return LANG_NAMES[l[0]] + '版';
  return (it.langs||[]).includes('multi') ? '多國語合輯' : (it.ext||'').toUpperCase();
}
function hashId(s){ let h = 5381; for (const c of s) h = ((h << 5) + h + c.codePointAt(0)) >>> 0; return h.toString(36); }
function buildGroups(items){
  const map = new Map();
  for (const it of items){
    const key = it.group || `${it.sourcePage}|${baseTitle(it.title)}`;
    if (!map.has(key)) map.set(key, []);
    map.get(key).push(it);
  }
  return [...map.entries()].map(([key, arr]) => {
    arr.sort((a,b) => langRank(a) - langRank(b));
    const langs = [...new Set(arr.flatMap(effLangs))];
    const categories = [...new Set(arr.flatMap(i => i.categories))];
    return {
      gid: hashId(key),
      title: arr[0].groupTitle || (arr.length > 1 ? baseTitle(arr[0].title) : arr[0].title),
      items: arr, cover: arr.find(i => i.thumb) || arr[0], langs, categories,
      primaryCategory: arr[0].primaryCategory, agency: arr[0].agency, sourcePage: arr[0].sourcePage,
      date: arr.map(dateOf).sort().pop(), addedAt: arr.map(i => i.addedAt).sort().pop(),
      text: fold(arr.map(i => [i.title, i.snippet, i.agency, i.sourceName, i.categories.join(' ')].join(' ')).join(' ') + ' ' + langs.map(l => LANG_NAMES[l]).join(' ')),
    };
  }).sort((a,b) => b.date.localeCompare(a.date) || b.addedAt.localeCompare(a.addedAt));
}

// ---------- 搜尋 ----------
function relatedCats(q){
  const fq = fold(q); if (!fq) return [];
  return DATA.categories.filter(c => fold(c.name).includes(fq) || c.keywords.some(k => { const fk = fold(k); return fk === fq || (fq.length >= 2 && fk.includes(fq)) || (fk.length >= 2 && fq.includes(fk)); })).map(c => c.name);
}
function score(g, terms, cats){
  if (!terms.length) return 1;
  const title = fold(g.title); let s = 0;
  if (terms.every(t => title.includes(t))) s += 6; else if (terms.every(t => g.text.includes(t))) s += 3;
  if (g.categories.some(c => cats.includes(c))) s += 4;
  return s;
}
function filtered(){
  const terms = fold(state.q).split(/\s+/).filter(Boolean), cats = relatedCats(state.q);
  return GROUPS
    .filter(g => !state.fav || FAV.includes(g.gid))
    .filter(g => !state.cat || g.categories.includes(state.cat))
    .filter(g => !state.agency || g.agency === state.agency)
    .filter(g => !state.lang || g.langs.includes(state.lang))
    .filter(g => !state.type || g.items.some(i => typeOf(i) === state.type))
    .map(g => ({ g, s: score(g, terms, cats) })).filter(x => x.s > 0)
    .sort((a,b) => b.s - a.s || b.g.date.localeCompare(a.g.date)).map(x => x.g);
}
function hl(text){
  let h = esc(text);
  for (const t of state.q.trim().split(/\s+/).filter(Boolean)){
    h = h.replace(new RegExp(esc(t).replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi'), m => `<mark>${m}</mark>`);
  }
  return h;
}

// ---------- 卡片 ----------
const viewHref = it => `view.html?id=${encodeURIComponent(it.id)}`;
const sizeTxt = it => it.size ? `${(it.size/1048576).toFixed(it.size>1048576?1:2)}MB` : '';
function thumbHtml(it){
  const typeLabel = `<span class="type">${esc((it.ext||'file').toUpperCase())}</span>`;
  return it.thumb ? `<img loading="lazy" src="${esc(it.thumb)}" alt="" onerror="this.outerHTML='${typeLabel.replace(/"/g,'&quot;')}'">` : typeLabel;
}
function flagsOf(g){ return LANG_ORDER.filter(l => g.langs.includes(l)).map(l => `<span title="${LANG_NAMES[l]}">${FLAGS[l]}</span>`).join(''); }
function card(g){
  const isNew = Date.now() - new Date(g.addedAt).getTime() < 7*864e5;
  const one = g.items.length === 1 ? g.items[0] : null;
  const open = one ? `<a class="thumb" href="${viewHref(one)}">` : `<button class="thumb" data-open="${g.gid}" aria-label="選擇語言">`;
  return `<article class="card">
    ${open}${thumbHtml(g.cover)}${isNew?'<span class="badge-new">NEW</span>':''}${one?'':`<span class="badge-count">${g.items.length} 種語言</span>`}${one?'</a>':'</button>'}
    <div class="body">
      <div class="title" title="${esc(g.title)}">${hl(g.title)}</div>
      <div class="meta">${esc(g.agency)} · ${esc(g.date)}</div>
      <div class="langs">${flagsOf(g)}</div>
      <span class="tag">${catIcon(g.primaryCategory)} ${esc(g.primaryCategory)}</span>
      <div class="actions">
        ${one ? `<a class="primary" href="${viewHref(one)}">開啟</a>` : `<button class="primary" data-open="${g.gid}">選擇語言</button>`}
        <button class="ib line" data-share="${g.gid}" title="分享到 LINE">LINE</button>
        <button class="ib ${isFav(g.gid)?'on':''}" data-fav="${g.gid}" title="收藏">${isFav(g.gid)?'♥':'♡'}</button>
      </div>
    </div></article>`;
}

// ---------- 分享 ----------
function shareUrl(g){
  const base = location.href.split('#')[0];
  return g.items.length === 1 ? new URL(viewHref(g.items[0]), base).href : `${base}#open=${g.gid}`;
}
async function share(g){
  const url = shareUrl(g), text = `${g.title}｜移次搞定`;
  if (navigator.share) { try { await navigator.share({ title: text, url }); return; } catch (e) { if (e.name === 'AbortError') return; } }
  window.open(`https://social-plugins.line.me/lineit/share?url=${encodeURIComponent(url)}&text=${encodeURIComponent(text)}`, '_blank', 'noopener');
}
let toastT;
function toast(msg){ const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 1600); }

// ---------- 版本選單 ----------
function openSheet(g){
  if (!g) return;
  document.getElementById('sheet-title').textContent = g.title;
  document.getElementById('sheet-meta').innerHTML = `${esc(g.agency)} · ${esc(g.date)} · <a href="${esc(g.sourcePage)}" target="_blank" rel="noopener">原網頁</a>`;
  document.getElementById('sheet-actions').innerHTML = `<button class="ib line" data-share="${g.gid}">LINE 分享</button><button class="ib ${isFav(g.gid)?'on':''}" data-fav="${g.gid}">${isFav(g.gid)?'♥ 已收藏':'♡ 收藏'}</button>`;
  document.getElementById('sheet-list').innerHTML = g.items.map(it => `
    <a class="ver" href="${viewHref(it)}">
      <span class="vthumb">${thumbHtml(it)}</span>
      <span class="vinfo"><b>${FLAGS[effLangs(it)[0]]||''} ${esc(versionLabel(it))}</b><small>${esc((it.ext||'').toUpperCase())}${sizeTxt(it)?' · '+sizeTxt(it):''}</small></span>
      <span class="vgo">開啟 ›</span>
    </a>`).join('');
  document.getElementById('sheet').hidden = false;
  document.body.style.overflow = 'hidden';
}
function closeSheet(){ document.getElementById('sheet').hidden = true; document.body.style.overflow = ''; }

// ---------- 新聞 ----------
function ago(iso){
  const m = Math.max(1, Math.round((Date.now() - new Date(iso).getTime()) / 6e4));
  if (m < 60) return `${m} 分鐘前`; const h = Math.round(m / 60); if (h < 24) return `${h} 小時前`; return `${Math.round(h / 24)} 天前`;
}
function newsList(limit){
  const items = (NEWS && NEWS.items || []).slice(0, limit);
  if (!items.length) return '<div class="empty">新聞載入中或暫時沒有資料</div>';
  return `<ol class="newslist">${items.map((n, i) => `
    <li><span class="rank">${i + 1}</span><div class="nbody">
      <a class="ntitle" href="${esc(n.link)}" target="_blank" rel="noopener">${esc(n.title)}</a>
      <div class="nmeta">${esc(n.source)} · ${ago(n.pubDate)}${n.count > 1 ? ` · <span class="ncount">${n.count} 家媒體報導</span>` : ''}</div>
      ${n.sources.length > 1 ? `<details><summary>看其他媒體</summary>${n.sources.filter(x => x.link !== n.link).map(x => `<a href="${esc(x.link)}" target="_blank" rel="noopener">${esc(x.name)}：${esc(x.title)}</a>`).join('')}</details>` : ''}
    </div></li>`).join('')}</ol>`;
}

// ---------- 宣導行事曆 ----------
function nowSeasons(){
  const m = new Date().getMonth() + 1;
  return (INFO?.seasons || []).filter(s => s.months.includes(m));
}
// 節日每年自動推算：固定日期直接排、農曆新年查表、伊斯蘭節日用手機內建的伊斯蘭曆（預估）
const ymd = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
let HIJRI = null;
try {
  HIJRI = new Intl.DateTimeFormat('en-u-ca-islamic-umalqura', { month:'numeric', day:'numeric', timeZone:'Asia/Taipei' });
  if (!/islamic/.test(HIJRI.resolvedOptions().calendar)) HIJRI = null;
} catch { HIJRI = null; }
function hijriDate(year, hm, hd){
  if (!HIJRI) return null;
  const want = { month: String(hm), day: String(hd) };
  for (let d = new Date(year, 0, 1, 12); d.getFullYear() === year; d.setDate(d.getDate() + 1)) {
    const p = Object.fromEntries(HIJRI.formatToParts(d).map(x => [x.type, x.value]));
    if (p.month === want.month && p.day === want.day) return ymd(d);
  }
  return null;
}
let EVENT_CACHE = null;
function allEvents(){
  if (EVENT_CACHE) return EVENT_CACHE;
  const y0 = new Date().getFullYear(), out = [];
  for (const y of [y0, y0 + 1]) {
    for (const r of INFO?.eventRules || []) {
      let date = null, approx = false;
      if (r.type === 'fixed') date = `${y}-${r.md}`;
      else if (r.type === 'lunarNewYear') date = INFO.lunarNewYear?.[y] || null;
      else if (r.type === 'hijri') {
        date = INFO.hijriOverrides?.[r.name]?.[y] || null;
        if (!date) { date = hijriDate(y, r.hm, r.hd); approx = !!date; }
      }
      if (date) out.push({ ...r, date, approx });
    }
  }
  return (EVENT_CACHE = out.sort((a, b) => a.date.localeCompare(b.date)));
}
function upcomingEvents(days){
  const today = new Date(); today.setHours(0,0,0,0);
  return allEvents().map(e => ({ ...e, left: Math.round((new Date(e.date + 'T00:00:00') - today) / 864e5) }))
    .filter(e => e.left >= 0 && e.left <= days);
}
// 勞動部新公告偵測（crawler/watch.js 產生 watch.json）：比數字表更新日期還新的才顯示
function newNotices(){
  const since = INFO?.updated || '';
  // 勞動部「政策法令」公告裡跟這些數字有關的，也一起提醒
  const pol = (POLICY?.items || []).filter(p => /就業安定費|最低工資|基本工資|薪資|工資/.test(p.title))
    .map(p => ({ title: p.title, link: p.url, source: '勞動部政策法令', pubDate: p.date || p.seenAt || '' }));
  return [...pol, ...(WATCH?.items || [])].filter(n => (n.pubDate || '').slice(0, 10) > since);
}

// ---------- 共用：區塊外框（依內容類型上色，一眼分出文宣／聘僱／新聞／工具） ----------
const KIND = {
  poster: { label: '文宣', color: '#0f766e' },
  hire:   { label: '聘僱', color: '#4f46e5' },
  news:   { label: '新聞', color: '#c2410c' },
  tool:   { label: '工具', color: '#b91c1c' },
};
let PANEL_TAG = true; // 首頁與搜尋結果混合多種內容時，才在每個區塊標上類型
function panel(kind, title, body, extra = '') {
  const k = KIND[kind];
  return `<section class="pn" style="--k:${k.color}"><h2>${PANEL_TAG ? `<span class="kind">${k.label}</span>` : ''}${title}${extra}</h2>${body}</section>`;
}
const sub = (title, extra = '') => `<h3 class="sub">${title}${extra}</h3>`;
const goBtn = (label, attrs) => `<button class="go" ${attrs}>${label} ›</button>`;

// ---------- 首頁 ----------
function homeView(){
  const menu = `<div class="menu">
    <button class="mi" style="--k:${KIND.poster.color}" data-tab="posters"><b>🗂️</b><span>宣導文宣</span><small>${GROUPS.length} 則</small></button>
    <button class="mi" style="--k:${KIND.hire.color}" data-tab="hire"><b>📋</b><span>聘僱指南</span><small>${GUIDES?.industries?.length || 0} 種行業</small></button>
    <button class="mi" style="--k:${KIND.news.color}" data-tab="news"><b>📰</b><span>移工新聞</span><small>${NEWS?.items?.length || 0} 則熱門</small></button>
    <button class="mi" style="--k:${KIND.tool.color}" data-tab="tools"><b>🧰</b><span>專線工具</span><small>專線・行事曆</small></button>
  </div>`;

  // 文宣：本月重點、最新、主題
  const seasons = nowSeasons(), events = upcomingEvents(60);
  const focusCats = [...new Set([...seasons.flatMap(s => s.cats), ...events.flatMap(e => e.cats)])].filter(c => c !== '交通安全' && (c !== '生活適應' || events.length));
  const focus = GROUPS.filter(g => g.categories.some(c => focusCats.includes(c))).slice(0, 10);
  const pills = seasons.filter(s => s.months.length < 12).map(s => `<span class="pill" data-go-cat="${esc(s.cats[0])}">${s.icon} ${esc(s.name)}</span>`).join('')
    + upcomingEvents(120).slice(0, 2).map(e => `<span class="pill ev" data-tab="tools" data-anchor="cal">${e.icon} ${esc(e.name.split('（')[0])} · ${e.left === 0 ? '今天' : `${e.approx ? '約' : ''}還有 ${e.left} 天`}</span>`).join('');
  const tiles = DATA.categories.map(c => ({ c, n: GROUPS.filter(g => g.categories.includes(c.name)).length })).filter(x => x.n)
    .map(({ c, n }) => `<button class="tile" data-go-cat="${esc(c.name)}"><b>${c.icon||'📁'}</b><span>${esc(c.name)}</span><small>${n}</small></button>`).join('');

const daysAgo = d => Math.round((Date.now() - new Date(d + 'T00:00:00').getTime()) / 864e5);
const rocDate = d => { const [y, m, dd] = d.split('-').map(Number); return `${y - 1911}/${m}/${dd}`; };
function lawRow(l){
  const fresh = l.amended && daysAgo(l.amended) <= 90;
  return `<a class="li" href="${esc(l.url)}" target="_blank" rel="noopener"><span class="ic">📜</span><span class="tx"><b>${esc(l.title)}${fresh ? ' <span class="newb">最新修正</span>' : ''}</b><small>${l.amended ? `最新修正：民國 ${rocDate(l.amended)}（${l.amended}）` : ''}</small></span><span class="no">›</span></a>`;
}
function lawsFor(names){
  const items = LAWS?.items || [];
  return names.map(n => items.find(l => l.title === n) || items.find(l => l.title.includes(n)) || { title: n, url: `https://law.moj.gov.tw/Law/LawSearchResult.aspx?ty=ONEBAR&kw=${encodeURIComponent(n)}` });
}
const ul = arr => arr?.length ? `<ul class="pts">${arr.map(x => `<li>${esc(x)}</li>`).join('')}</ul>` : '';
function stepsHtml(){
  return `<ol class="steps">${(GUIDES?.commonSteps || []).map(s => `<li><b>${esc(s.t)}</b><span>${esc(s.d)}</span></li>`).join('')}</ol>`;
}
// 勞動部「政策法令」公告（crawler/policy.js 每天更新），依行業關鍵字分類
const pDate = p => p.date || (p.seenAt || '').slice(0, 10);
const slash = d => d.replace(/-/g, '/');
const indsOfPolicy = p => (GUIDES?.industries || []).filter(g => g.kw && new RegExp(g.kw).test(p.title)).map(g => g.id);
function policyFor(g){
  const all = POLICY?.items || [];
  return { mine: all.filter(p => new RegExp(g.kw).test(p.title)), general: all.filter(p => !indsOfPolicy(p).length) };
}
function policyRow(p){
  const d = pDate(p), fresh = d && daysAgo(d) <= 30;
  return `<a class="li" href="${esc(p.url)}" target="_blank" rel="noopener"><span class="ic">📢</span><span class="tx"><b>${hl(p.title)}${fresh ? ' <span class="newb">NEW</span>' : ''}</b><small>${d ? slash(d) + ' 勞動部公告' : ''}</small></span><span class="no">›</span></a>`;
}
// 比重點整理日期還新的法條修正或公告 → 提醒「重點整理可能過期」
function staleFor(g){
  const since = GUIDES.updated, out = [];
  const ch = LAWS?.chapters?.[g.id];
  if (ch?.changedAt && ch.changedAt > since) out.push(`${slash(ch.changedAt)} 偵測到法條內容變動`);
  const laws = [...lawsFor(g.laws), ...(ch?.parts || []).map(x => ({ title: x.law, amended: x.amended }))];
  for (const l of laws) if (l.amended && l.amended > since) out.push(`${slash(l.amended)} 修正「${l.title}」`);
  const pf = policyFor(g);
  for (const p of [...pf.mine, ...pf.general]) { const d = pDate(p); if (d && d > since) out.push(`${slash(d)} 勞動部公告：${p.title}`); }
  return [...new Set(out)];
}
function staleBox(list){
  if (!list.length) return '';
  return `<div class="notice stale"><b>⚠️ 有比這份整理更新的規定，下方重點可能還沒跟上</b>${list.slice(0, 4).map(x => `<span>・${esc(x)}</span>`).join('')}<small>請以「官方最新公告」和「法條原文」為準</small></div>`;
}
function articlesHtml(ch){
  return ch.parts.map(pt => `<div class="lawpart"><b>${esc(pt.law)}</b><small>${esc(pt.heading)}・${pt.articles.length} 條${pt.amended ? `・最新修正 ${slash(pt.amended)}` : ''}</small>
    ${pt.articles.map(a => `<details class="art"><summary><b>第 ${esc(a.no)} 條</b><span>${esc(a.text.split('\n')[0].slice(0, 40))}</span></summary><div class="atext">${esc(a.text).replace(/\n/g, '<br>')}</div></details>`).join('')}
    <a class="lawlink" href="${esc(pt.url)}" target="_blank" rel="noopener">到全國法規資料庫看全文 ›</a></div>`).join('');
}
// ---------- 申請應備文件清單（可勾選、複製、LINE 傳送） ----------
const CN = '一二三四五六七八九十';
const cnNum = n => n <= 10 ? CN[n - 1] : n < 20 ? '十' + CN[n - 11] : String(n);
let DOCS_DONE = {};
try { DOCS_DONE = JSON.parse(localStorage.getItem('yici-docs') || '{}') || {}; } catch {}
const saveDocs = () => { try { localStorage.setItem('yici-docs', JSON.stringify(DOCS_DONE)); } catch {} };
const docKeys = g => g.docs.flatMap((grp, gi) => grp.items.map((_, ii) => `${g.id}:${gi}:${ii}`));
function docsHtml(g){
  const keys = docKeys(g), done = keys.filter(k => DOCS_DONE[k]).length;
  const groups = g.docs.map((grp, gi) => sub(esc(grp.g)) + `<div class="cks">${grp.items.map((x, ii) => { const k = `${g.id}:${gi}:${ii}`;
    return `<label class="ck"><input type="checkbox" data-ck="${k}" ${DOCS_DONE[k] ? 'checked' : ''}><span><b>${cnNum(ii + 1)}、${esc(x.t)}</b>${x.d ? `<small>${esc(x.d)}</small>` : ''}</span></label>`; }).join('')}</div>`).join('');
  return `<div class="ckbar"><span class="ckn">已備齊 <b id="ckdone">${done}</b> / ${keys.length} 項</span><button class="mini" data-docs-copy="${g.id}">📋 複製清單</button><button class="mini line" data-docs-line="${g.id}">LINE 傳送</button><button class="mini" data-docs-reset="${g.id}" ${done ? '' : 'hidden'}>清除勾選</button></div>`
    + groups + `<p class="src-note">${esc(GUIDES.docsNote || '')}</p>`;
}
function docsText(g){
  const lines = [`申請${g.name}移工所需準備資料`];
  g.docs.forEach(grp => { lines.push('', `【${grp.g}】`); grp.items.forEach((x, i) => lines.push(`${cnNum(i + 1)}、${x.t}${x.d ? `（${x.d}）` : ''}`)); });
  lines.push('', `資料來源：移次搞定 ${location.origin}${location.pathname}#tab=hire&g=${g.id}`);
  return lines.join('\n');
}
async function copyText(text){
  try { await navigator.clipboard.writeText(text); return true; }
  catch {
    const ta = document.createElement('textarea'); ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    let ok = false; try { ok = document.execCommand('copy'); } catch {}
    ta.remove(); return ok;
  }
}

    + `<div id="nums">${panel('tool', '重要數字速查',
        (notices.length ? `<div class="notice"><b>📢 勞動部有新公告，下列數字可能已調整，待確認更新</b>${notices.slice(0,4).map(n => `<a href="${esc(n.link)}" target="_blank" rel="noopener">${esc(n.title)}<small>${esc(n.source)}・${esc((n.pubDate||'').slice(0,10))}</small></a>`).join('')}</div>` : '')
        + `<div class="list"><table class="nums">${nums}</table></div><p class="src-note">數字以勞動部最新公告為準：${INFO.numbersSources.map(s => `<a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.name)}</a>`).join('、')}</p>`,
        `<span class="n">${esc(INFO.updated)} 更新</span>`)}</div>`;
}

// ---------- 全站搜尋：文宣、聘僱、新聞、專線、法規一起找 ----------
function searchView(){
  const q = state.q.trim();
  const terms = fold(q).split(/\s+/).filter(Boolean);
  const hit = text => { const t = fold(text); return terms.every(x => t.includes(x)); };
  const posters = filtered();
  const guides = (GUIDES?.industries || []).filter(g => hit([g.name, g.short, ...g.who, ...g.quota, ...g.fee, ...g.wage, ...(g.notes||[]), ...(g.docs||[]).flatMap(d => [d.g, ...d.items.map(x => x.t + ' ' + (x.d || ''))])].join(' ')));
  const steps = (GUIDES?.commonSteps || []).filter(s => hit(s.t + ' ' + s.d));
  const news = (NEWS?.items || []).filter(n => hit(n.title + ' ' + n.sources.map(s => s.title).join(' ')));
  const sea = seaItems().filter(n => hit(n.title + ' ' + (n.desc || '')));
  const tools = [
    ...(INFO?.hotlines || []).filter(h => hit(`${h.no} ${h.name} ${h.desc}`)).map(h => `<a class="li" href="tel:${h.tel}"><span class="ic">${h.icon}</span><span class="tx"><b>${esc(h.name)}</b><small>${esc(h.desc)}</small></span><span class="no">${esc(h.no)}</span></a>`),
    ...(INFO?.offices || []).filter(o => hit(`${o.name} ${o.addr} ${o.tel}`)).map(o => `<a class="li" href="tel:${o.tel.replace(/-/g,'')}"><span class="ic">${o.flag}</span><span class="tx"><b>${esc(o.name)}</b><small>${esc(o.addr)}</small></span><span class="no">${esc(o.tel)}</span></a>`),
    ...(INFO?.numbers || []).flatMap(g => g.items).filter(x => hit(`${x.label} ${x.note} ${x.value}`)).map(x => `<button class="li btnli" data-tab="tools" data-anchor="nums"><span class="ic">🔢</span><span class="tx"><b>${esc(x.label)}</b><small>${esc(x.note || '')}</small></span><span class="no">${esc(x.next && ymd(new Date()) >= x.next.from ? x.next.value : x.value)}</span></button>`),
  ];
  const laws = (LAWS?.items || []).filter(l => hit(l.title));
  const pols = (POLICY?.items || []).filter(p => hit(p.title));
  const seenArt = new Set(), arts = [];
  for (const [id, ch] of Object.entries(LAWS?.chapters || {})) for (const pt of ch.parts || []) for (const a of pt.articles) {
    const key = pt.pcode + '#' + a.no;
    if (seenArt.has(key) || !hit(a.text)) continue;
    seenArt.add(key); arts.push({ id, pt, a });
  }
  const snip = t => { const f = fold(t), i = Math.max(0, f.indexOf(terms[0]) - 14); return (i ? '…' : '') + t.slice(i, i + 60).replace(/\n/g, ' ') + '…'; };
  const artRows = arts.slice(0, 8).map(({ id, pt, a }) => `<button class="li btnli" data-guide="${id}"><span class="ic">📖</span><span class="tx"><b>${esc(pt.law.length > 24 ? pt.heading : pt.law)} 第 ${esc(a.no)} 條</b><small>${hl(snip(a.text))}</small></span><span class="no">›</span></button>`);
  const total = posters.length + guides.length + steps.length + news.length + sea.length + tools.length + laws.length + pols.length + arts.length;
  const rc = relatedCats(q);
  let html = `<div class="pagehead" style="--k:#475569"><span class="kind" style="background:#475569">搜尋</span><b>「${esc(q)}」</b><span class="n">共 ${total} 筆</span></div>`;
  if (!total) return html + '<div class="empty">找不到相關內容，換個關鍵字試試<br><small>可以搜尋文宣主題、行業（製造業、看護）、新聞、專線號碼</small></div>';
  if (guides.length || steps.length) html += panel('hire', `聘僱指南<span class="n">${guides.length + steps.length}</span>`,
    `<div class="indlist">${guides.map(x => `<button class="indcard" data-guide="${x.id}"><b>${x.icon}</b><span><strong>${esc(x.name)}</strong><small>${esc(x.short)}</small></span><i>›</i></button>`).join('')}</div>`
    + (steps.length ? `<ol class="steps">${steps.map(s => `<li><b>${hl(s.t)}</b><span>${hl(s.d)}</span></li>`).join('')}</ol>` : ''));
  if (posters.length) html += panel('poster', `宣導文宣<span class="n">${posters.length}</span>`,
    (rc.length ? `<p class="lead">也帶出類別：<b>${rc.map(esc).join('、')}</b>（含各國語言版本）</p>` : '') + `<div class="row">${posters.slice(0, 10).map(card).join('')}</div>`,
    posters.length > 0 ? goBtn(`看全部 ${posters.length} 則`, 'data-search-posters') : '');
  if (news.length || sea.length) html += panel('news', `移工新聞<span class="n">${news.length + sea.length}</span>`, (sea.length ? `<ul class="seamini">${sea.slice(0, 6).map(n => `<li><span class="flag">${n.flag}</span><div><a href="${esc(n.url)}" target="_blank" rel="noopener">${hl(n.title)}</a><small>${esc(n.source)}${n.date ? '・' + slash(n.date) : ''}</small></div></li>`).join('')}</ul>` : '') + `<ol class="newslist">${news.slice(0, 5).map((n, i) => `<li><span class="rank">${i+1}</span><div class="nbody"><a class="ntitle" href="${esc(n.link)}" target="_blank" rel="noopener">${hl(n.title)}</a><div class="nmeta">${esc(n.source)} · ${ago(n.pubDate)}</div></div></li>`).join('')}</ol>`);
  if (tools.length) html += panel('tool', `專線與數字<span class="n">${tools.length}</span>`, `<div class="list">${tools.join('')}</div>`);
  if (laws.length || pols.length || arts.length) html += panel('hire', `法規與公告<span class="n">${laws.length + pols.length + arts.length}</span>`,
    `<div class="list">${[...pols.slice(0, 5).map(policyRow), ...laws.map(lawRow), ...artRows].join('')}</div>`);
  return html;
}

// ---------- 篩選列（只在文宣分頁出現） ----------
function renderFilters(){
  const el = document.getElementById('filters');
  el.hidden = state.tab !== 'posters';
  if (el.hidden) return;
  const count = fn => GROUPS.filter(fn).length;
  const agencies = [...new Set(GROUPS.map(g => g.agency))].sort();
  el.innerHTML = `<span class="chip fav" data-k="fav" data-v="1" aria-pressed="${!!state.fav}">❤️ 收藏 ${FAV.length}</span><span class="sep"></span>`
    + DATA.categories.map(c => { const n = count(g => g.categories.includes(c.name)); return n ? `<span class="chip" data-k="cat" data-v="${esc(c.name)}" aria-pressed="${state.cat===c.name}">${c.icon||''} ${esc(c.name)}<span class="n">${n}</span></span>` : ''; }).join('')
    + '<span class="sep"></span>'
    + LANG_ORDER.filter(l => l !== 'multi' && count(g => g.langs.includes(l))).map(l => `<span class="chip" data-k="lang" data-v="${l}" aria-pressed="${state.lang===l}">${FLAGS[l]} ${LANG_NAMES[l]}</span>`).join('')
    + '<span class="sep"></span>'
    + [['img','圖片'],['pdf','PDF']].map(([v,t]) => `<span class="chip" data-k="type" data-v="${v}" aria-pressed="${state.type===v}">${t}</span>`).join('')
    + `<select class="chip" id="agency" aria-label="機關"><option value="">全部機關</option>${agencies.map(a => `<option ${state.agency===a?'selected':''}>${esc(a)}</option>`).join('')}</select>`;
  document.getElementById('agency').onchange = e => { state.agency = e.target.value; state.limit = PAGE; update(); };
}

// ---------- 畫面更新與網址 ----------
const VIEWS = { home: homeView, posters: postersView, hire: hireView, news: newsView, tools: toolsView, search: searchView };
function render(){
  const out = document.getElementById('out');
  if (!GROUPS.length && ['home','posters'].includes(state.tab)) { out.innerHTML = '<div class="empty">載入中…</div>'; return; }
  PANEL_TAG = ['home', 'search'].includes(state.tab);
  out.innerHTML = (VIEWS[state.tab] || homeView)();
  document.querySelectorAll('.tab').forEach(t => t.setAttribute('aria-current', t.dataset.tab === state.tab ? 'page' : 'false'));
  document.getElementById('foot').hidden = state.tab !== 'posters';
}
function update(mode){
  renderFilters(); render();
  if (mode === 'none') return;
  const p = new URLSearchParams();
  if (state.tab !== 'home') p.set('tab', state.tab);
  if (state.tab === 'posters') for (const k of FILTER_KEYS) if (state[k]) p.set(k, state[k]);
  if (state.tab === 'search' && state.q) p.set('q', state.q);
  if (state.tab === 'hire' && state.guide) p.set('g', state.guide);
  const url = p.toString() ? `#${p}` : location.pathname + location.search;
  if (url !== (location.hash || location.pathname + location.search)) history[mode === 'replace' ? 'replaceState' : 'pushState'](null, '', url);
}
function go(tab, filters = {}, anchor){
  state.tab = tab; state.limit = PAGE;
  if (tab === 'posters') { for (const k of FILTER_KEYS) state[k] = ''; Object.assign(state, filters); }
  else if (tab !== 'search') state.q = '';
  if (tab === 'hire') state.guide = filters.guide || '';
  if (tab !== 'search') document.getElementById('q').value = '';
  update();
  if (anchor) setTimeout(() => document.getElementById(anchor)?.scrollIntoView({ behavior: 'smooth', block: 'start' }), 30);
  else window.scrollTo({ top: 0 });
}
function readHash(){
  const p = new URLSearchParams(location.hash.slice(1));
  state.tab = p.get('tab') || (p.get('q') ? 'search' : 'home');
  if (state.tab === 'fav') { state.tab = 'posters'; p.set('fav', '1'); }
  if (state.tab === 'help') state.tab = 'tools';
  for (const k of FILTER_KEYS) state[k] = p.get(k) || '';
  state.guide = p.get('g') || '';
  document.getElementById('q').value = state.tab === 'search' ? state.q : '';
  return p.get('open');
}

// ---------- 事件 ----------
document.addEventListener('click', e => {
  const el = s => e.target.closest(s);
  let x;
  if ((x = el('[data-open]'))) { e.preventDefault(); openSheet(GROUPS.find(g => g.gid === x.dataset.open)); return; }
  if (el('[data-close]')) { closeSheet(); return; }
  if ((x = el('[data-share]'))) { e.preventDefault(); share(GROUPS.find(g => g.gid === x.dataset.share)); return; }
  if ((x = el('[data-fav]'))) { e.preventDefault(); toggleFav(x.dataset.fav); if (!document.getElementById('sheet').hidden) openSheet(GROUPS.find(g => g.gid === x.dataset.fav)); render(); renderFilters(); return; }
  if ((x = el('[data-go-cat]'))) { go('posters', { cat: x.dataset.goCat }); return; }
  if ((x = el('[data-guide]'))) { go('hire', { guide: x.dataset.guide }); return; }
  if (el('[data-search-posters]')) { const q = state.q; go('posters', { q }); return; }
  if ((x = el('[data-to-posters]'))) { go('posters', { fav: '1' }); return; }
  if ((x = el('[data-anchor-only]'))) { e.preventDefault(); document.getElementById(x.dataset.anchorOnly)?.scrollIntoView({ behavior: 'smooth', block: 'start' }); return; }
  if ((x = el('[data-tab]'))) { e.preventDefault(); go(x.dataset.tab, {}, x.dataset.anchor); return; }
  if ((x = el('.chip[data-k]'))) { state[x.dataset.k] = state[x.dataset.k] === x.dataset.v ? '' : x.dataset.v; state.limit = PAGE; update(); return; }
  if (el('[data-more]')) { state.limit += PAGE; render(); return; }
  if (el('[data-reset]')) { for (const k of FILTER_KEYS) state[k] = ''; update(); return; }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); });
// 應備文件：勾選、複製、LINE 傳送、清除
document.addEventListener('change', e => {
  const k = e.target.dataset?.ck;
  if (!k) return;
  if (e.target.checked) DOCS_DONE[k] = 1; else delete DOCS_DONE[k];
  saveDocs();
  const g = GUIDES?.industries.find(x => x.id === k.split(':')[0]);
  if (g) {
    const n = docKeys(g).filter(x => DOCS_DONE[x]).length;
    document.getElementById('ckdone').textContent = n;
    document.querySelector('[data-docs-reset]').hidden = !n;
    if (n === docKeys(g).length) toast('資料都備齊了 🎉');
  }
});
document.addEventListener('click', async e => {
  const b = e.target.closest('[data-docs-copy],[data-docs-line],[data-docs-reset]');
  if (!b) return;
  const id = b.dataset.docsCopy || b.dataset.docsLine || b.dataset.docsReset;
  const g = GUIDES?.industries.find(x => x.id === id);
  if (!g) return;
  if (b.dataset.docsCopy) toast(await copyText(docsText(g)) ? '已複製，可以直接貼到 LINE' : '複製失敗，請長按文字自行複製');
  else if (b.dataset.docsLine) window.open('https://line.me/R/share?text=' + encodeURIComponent(docsText(g)), '_blank', 'noopener');
  else { docKeys(g).forEach(k => delete DOCS_DONE[k]); saveDocs(); render(); setTimeout(() => document.getElementById('docs')?.scrollIntoView({ block: 'start' }), 0); }
});
let typing, beforeSearch = 'home';
document.getElementById('q').addEventListener('input', e => {
  clearTimeout(typing);
  typing = setTimeout(() => {
    const v = e.target.value;
    if (!v.trim()) { state.q = ''; if (state.tab === 'search') { state.tab = beforeSearch; update('replace'); } return; }
    const first = state.tab !== 'search';
    if (first) beforeSearch = state.tab;
    if (first) for (const k of FILTER_KEYS) state[k] = '';
    state.q = v; state.tab = 'search';
    update(first ? 'push' : 'replace');
  }, 220);
});
document.getElementById('form').addEventListener('submit', e => { e.preventDefault(); document.getElementById('q').blur(); });
document.getElementById('clear').onclick = () => { document.getElementById('q').value = ''; state.q = ''; if (state.tab === 'search') state.tab = beforeSearch; update('replace'); };
window.addEventListener('popstate', () => { closeSheet(); const open = readHash(); update('none'); if (open) openSheet(GROUPS.find(g => g.gid === open)); });

function renderReport(rep){
  if (!rep?.sources) return;
  document.getElementById('report').innerHTML = `<p>最近一次：${new Date(rep.finishedAt).toLocaleString('zh-TW')}</p>` +
    rep.sources.map(s => `<div class="src"><span class="${s.ok && !s.errors.length ? 'ok' : s.ok ? '' : 'bad'}">${s.ok ? (s.errors.length ? '⚠' : '✔') : '✘'}</span>
      <span><b>${esc(s.agency)}</b> ${esc(s.name)}：新增 ${s.newCount} 筆${s.errors.length ? `<br><small>${s.errors.slice(0,3).map(esc).join('<br>')}</small>` : ''}</span></div>`).join('');
}

(async () => {
  const open = readHash();
  renderFilters(); render();
  const j = u => fetch(u + '?' + Date.now()).then(r => r.json());
  const res = await Promise.allSettled(['catalog.json', 'info.json', 'news.json', 'watch.json', 'guides.json', 'laws.json', 'policy.json', 'sea-news.json'].map(j));
  const val = i => res[i].status === 'fulfilled' ? res[i].value : null;
  DATA = val(0) || DATA; DATA.items ||= []; DATA.categories ||= [];
  INFO = val(1); NEWS = val(2); WATCH = val(3); GUIDES = val(4); LAWS = val(5); POLICY = val(6); SEA = val(7);
  GROUPS = buildGroups(DATA.items);
  document.getElementById('updated').innerHTML = DATA.updatedAt ? `${GROUPS.length} 則文宣<br>${new Date(DATA.updatedAt).toLocaleDateString('zh-TW')} 更新` : '';
  document.getElementById('toolsdot').hidden = !newNotices().length;
  update('none');
  if (open) openSheet(GROUPS.find(g => g.gid === open));
  j('report.json').then(renderReport).catch(() => {});
})();
</script>
