<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>移次搞定｜移工文宣・新聞一次找齊</title>
<meta name="description" content="移次搞定：各政府機關移工宣導文宣（中、越、印、泰、英）、熱門移工新聞、求助專線，一次找齊。">
<meta name="theme-color" content="#f6f3ec">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2224%22 fill=%22%230f766e%22/><text x=%2250%22 y=%2270%22 font-size=%2260%22 text-anchor=%22middle%22 fill=%22white%22 font-family=%22sans-serif%22 font-weight=%22900%22>移</text></svg>">
<style>
  :root{
    --bg:#f6f3ec; --paper:#fffdf8; --ink:#1f2a2e; --muted:#6b7378; --line:#e4ddd0;
    --accent:#0f766e; --accent-soft:#d8efe9; --warn:#b45309; --sun:#f59e0b; --bad:#b91c1c; --chip:#efe9dd;
    --radius:14px; --shadow:0 1px 2px rgba(0,0,0,.05),0 6px 18px rgba(31,42,46,.06);
    --tabbar:64px;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--bg);color:var(--ink);padding-bottom:calc(var(--tabbar) + 24px + env(safe-area-inset-bottom));
    font:15px/1.55 "Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif}
  a{color:var(--accent)}
  button{font:inherit;color:inherit}
  .wrap{max-width:1100px;margin:0 auto;padding:0 16px}

  /* 頂部 */
  header{padding:18px 0 4px}
  .top{display:flex;align-items:center;gap:10px}
  .brand{display:inline-flex;align-items:center;gap:10px;font-weight:900;font-size:24px;letter-spacing:.04em;text-decoration:none;color:var(--ink)}
  .brand em{font-style:normal;background:linear-gradient(90deg,var(--accent),var(--sun));-webkit-background-clip:text;background-clip:text;color:transparent}
  .logo{width:34px;height:34px;border-radius:10px;background:var(--accent);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:20px;transform:rotate(-6deg);box-shadow:3px 3px 0 var(--sun)}
  .top small{margin-left:auto;font-size:12px;color:var(--muted);text-align:right;line-height:1.3}
  .tagline{font-size:13.5px;font-weight:600;margin:6px 0 0}

  .bar{position:sticky;top:0;z-index:5;background:linear-gradient(var(--bg) 82%,transparent);padding:10px 0 8px}
  .search{display:flex;gap:8px}
  .search input{flex:1;min-width:0;font:inherit;font-size:16px;padding:12px 15px;border:1.5px solid var(--line);
    border-radius:var(--radius);background:var(--paper);outline:none;box-shadow:var(--shadow)}
  .search input:focus{border-color:var(--accent)}
  .search button{border:0;border-radius:var(--radius);padding:0 15px;background:var(--chip);cursor:pointer}

  /* 篩選 */
  .filters{display:flex;gap:6px;margin-top:10px;align-items:center;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
  .filters::-webkit-scrollbar{display:none}
  .filters[hidden],[hidden]{display:none!important}
  .chip{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:5px 11px;font-size:13px;cursor:pointer;white-space:nowrap;user-select:none}
  .chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
  .chip .n{opacity:.6;margin-left:3px}
  select.chip{appearance:none;padding-right:24px;background-image:linear-gradient(45deg,transparent 50%,#888 50%),linear-gradient(135deg,#888 50%,transparent 50%);
    background-position:calc(100% - 12px) 50%,calc(100% - 8px) 50%;background-size:4px 4px;background-repeat:no-repeat}
  .sep{flex:none;width:1px;height:20px;background:var(--line);margin:0 2px}

  /* 區塊 */
  section.blk{margin:22px 0 6px}
  .blk h2{font-size:18px;margin:0 0 10px;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
  .blk h2 .n{font-size:12.5px;color:var(--muted);font-weight:400}
  .blk h2 .go{margin-left:auto;font-size:13px;font-weight:500;border:0;background:none;color:var(--accent);cursor:pointer;padding:0}
  .hint{background:var(--accent-soft);border-radius:10px;padding:8px 12px;font-size:13px;margin:6px 0 12px}
  .empty{text-align:center;color:var(--muted);padding:50px 10px}

  /* 國旗按鈕 */
  .flags{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:14px}
  .flag{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 4px 8px;background:var(--paper);border:1px solid var(--line);border-radius:16px;cursor:pointer;box-shadow:var(--shadow)}
  .flag b{font-size:28px;line-height:1.1}
  .flag span{font-size:12.5px;font-weight:600}
  .flag small{font-size:11px;color:var(--muted)}
  .flag:active{transform:scale(.97)}

  /* 本月宣導 */
  .season{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
  .pill{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:4px 10px;font-size:12.5px;background:#fff4dd;border:1px solid #f7d58a;cursor:pointer}
  .pill.ev{background:var(--accent-soft);border-color:#a7d8cd}

  /* 橫向捲動 */
  .row{display:grid;grid-auto-flow:column;grid-auto-columns:158px;gap:10px;overflow-x:auto;padding:2px 2px 8px;scroll-snap-type:x mandatory;scrollbar-width:none}
  .row::-webkit-scrollbar{display:none}
  .row .card{scroll-snap-align:start}
  .row .actions{display:none}
  .row .title{-webkit-line-clamp:2;font-size:13px}

  /* 主題方塊 */
  .tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  .tile{display:flex;flex-direction:column;align-items:center;gap:2px;padding:12px 4px 10px;background:var(--paper);border:1px solid var(--line);border-radius:14px;cursor:pointer;text-align:center}
  .tile b{font-size:24px;line-height:1.1}
  .tile span{font-size:12.5px;font-weight:600;line-height:1.25}
  .tile small{font-size:11px;color:var(--muted)}

  /* 專線 */
  .calls{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  .call{display:flex;flex-direction:column;align-items:center;padding:10px 4px;border-radius:14px;background:var(--accent);color:#fff;text-decoration:none;box-shadow:var(--shadow)}
  .call b{font-size:20px;letter-spacing:.02em}
  .call span{font-size:11.5px;opacity:.9;text-align:center;line-height:1.25}
  .call.red{background:var(--bad)} .call.orange{background:var(--warn)}
  .list{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
  .li{display:flex;gap:12px;align-items:center;padding:12px 14px;border-top:1px solid var(--line);text-decoration:none;color:inherit}
  .li:first-child{border-top:0}
  .li .ic{font-size:24px;flex:none;width:32px;text-align:center}
  .li .tx{flex:1;min-width:0}
  .li .tx b{display:block;font-size:14.5px}
  .li .tx small{display:block;color:var(--muted);font-size:12.5px;line-height:1.45}
  .li .no{flex:none;font-weight:800;color:var(--accent);font-size:15px;white-space:nowrap}
  table.nums{width:100%;border-collapse:collapse;font-size:14px}
  .nums th{text-align:left;font-size:12.5px;color:var(--muted);font-weight:600;padding:12px 14px 4px;background:var(--bg)}
  .nums td{padding:9px 14px;border-top:1px solid var(--line);vertical-align:top}
  .nums td.v{font-weight:800;white-space:nowrap;color:var(--accent);text-align:right}
  .nums small{display:block;color:var(--muted);font-size:12px;line-height:1.4}
  .src-note{font-size:12px;color:var(--muted);margin:8px 2px 0}

  /* 卡片 */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
  .card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--shadow)}
  .thumb{aspect-ratio:4/3;background:#ece6da;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative;text-decoration:none;border:0;padding:0;width:100%;cursor:pointer}
  .thumb img{width:100%;height:100%;object-fit:cover;object-position:top}
  .thumb .type{font-weight:700;font-size:22px;color:#8a7f6c;letter-spacing:.06em}
  .badge-new{position:absolute;top:8px;left:8px;background:var(--warn);color:#fff;font-size:11px;padding:2px 7px;border-radius:6px}
  .badge-count{position:absolute;right:8px;bottom:8px;background:rgba(31,42,46,.82);color:#fff;font-size:11.5px;padding:3px 8px;border-radius:999px}
  .body{padding:9px 11px 11px;display:flex;flex-direction:column;gap:5px;flex:1}
  .title{font-weight:600;font-size:14px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
  .meta{font-size:12px;color:var(--muted)}
  .langs{font-size:15px;letter-spacing:1px}
  .tag{font-size:11.5px;background:var(--chip);border-radius:6px;padding:1px 7px;align-self:flex-start}
  .actions{display:flex;gap:6px;margin-top:auto;padding-top:4px}
  .actions .primary{flex:1;text-align:center;font-size:13px;text-decoration:none;border-radius:9px;padding:7px 0;background:var(--accent);color:#fff;border:0;cursor:pointer}
  .ib{flex:none;width:34px;border:1px solid var(--line);background:var(--paper);border-radius:9px;cursor:pointer;font-size:15px;display:flex;align-items:center;justify-content:center;text-decoration:none}
  .ib.on{color:#e11d48;border-color:#fecdd3;background:#fff1f2}
  .ib.line{color:#06c755;font-weight:800;font-size:11px}
  mark{background:#fde68a;padding:0 1px;border-radius:2px}
  .more{text-align:center;margin:16px 0 4px}
  .more button{font-size:14px;border:1px solid var(--line);background:var(--paper);color:var(--accent);border-radius:999px;padding:9px 22px;cursor:pointer}

  /* 新聞 */
  .newslist{list-style:none;margin:0;padding:0;background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
  .newslist li{display:flex;gap:12px;padding:12px 14px;border-top:1px solid var(--line)}
  .newslist li:first-child{border-top:0}
  .rank{flex:none;width:26px;height:26px;border-radius:8px;background:var(--chip);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;color:var(--muted)}
  .newslist li:nth-child(-n+3) .rank{background:var(--warn);color:#fff}
  .nbody{flex:1;min-width:0}
  .ntitle{color:var(--ink);text-decoration:none;font-weight:600;line-height:1.45}
  .nmeta{font-size:12px;color:var(--muted);margin-top:3px}
  .ncount{color:var(--warn);font-weight:600}
  .nbody details{font-size:12.5px;margin-top:4px}
  .nbody summary{color:var(--accent);cursor:pointer}
  .nbody details a{display:block;color:var(--muted);text-decoration:none;padding:3px 0}

  /* 行事曆 */
  .ev-date{flex:none;width:52px;text-align:center;border-radius:10px;background:var(--accent-soft);padding:4px 0;line-height:1.15}
  .ev-date b{display:block;font-size:17px;color:var(--accent)}
  .ev-date small{font-size:11px;color:var(--muted)}
  .months{display:grid;grid-template-columns:repeat(12,1fr);gap:2px;margin-top:6px}
  .months i{height:6px;border-radius:3px;background:var(--chip)}
  .months i.on{background:var(--sun)}
  .months i.now{outline:2px solid var(--ink);outline-offset:1px}

  /* 底部分頁列 */
  nav.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:15;background:rgba(255,253,248,.96);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
    border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
  .tabs{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);height:var(--tabbar)}
  .tab{border:0;background:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;color:var(--muted);font-size:11.5px;position:relative}
  .tab b{font-size:21px;line-height:1;filter:grayscale(1);opacity:.7}
  .tab[aria-current="page"]{color:var(--accent);font-weight:700}
  .tab[aria-current="page"] b{filter:none;opacity:1}
  .tab[aria-current="page"]::before{content:"";position:absolute;top:0;left:30%;right:30%;height:3px;border-radius:0 0 3px 3px;background:var(--accent)}
  .tab .dot{position:absolute;top:8px;left:calc(50% + 8px);min-width:16px;height:16px;border-radius:8px;background:#e11d48;color:#fff;font-size:10px;line-height:16px;padding:0 4px;font-weight:700}

  /* 版本選單 */
  .sheet{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center}
  .sheet[hidden]{display:none}
  .sheet .backdrop{position:absolute;inset:0;background:rgba(20,25,28,.45)}
  .sheet .panel{position:relative;background:var(--paper);width:min(560px,100%);max-height:85vh;overflow:auto;
    border-radius:18px 18px 0 0;padding:18px 18px calc(24px + env(safe-area-inset-bottom));box-shadow:0 -10px 30px rgba(0,0,0,.18);animation:up .18s ease-out}
  @media (min-width:700px){ .sheet{align-items:center} .sheet .panel{border-radius:18px} }
  @keyframes up{from{transform:translateY(30px);opacity:.5}to{transform:none;opacity:1}}
  .panel h3{margin:0 34px 4px 0;font-size:17px;line-height:1.4}
  .panel .x{position:absolute;top:12px;right:12px;border:0;background:var(--chip);width:32px;height:32px;border-radius:50%;font-size:16px;cursor:pointer}
  .panel .pm{font-size:12.5px;color:var(--muted);margin-bottom:10px}
  .panel .pa{display:flex;gap:8px;margin-bottom:6px}
  .panel .pa .ib{width:auto;padding:6px 12px;font-size:13px;gap:4px}
  .ver{display:flex;align-items:center;gap:12px;padding:10px;border:1px solid var(--line);border-radius:12px;margin-top:8px;text-decoration:none;color:inherit}
  .ver:active,.ver:hover{border-color:var(--accent);background:#f3faf8}
  .vthumb{width:64px;height:64px;flex:none;border-radius:8px;overflow:hidden;background:#ece6da;display:flex;align-items:center;justify-content:center}
  .vthumb img{width:100%;height:100%;object-fit:cover;object-position:top}
  .vthumb .type{font-size:12px}
  .vinfo{flex:1;display:flex;flex-direction:column}
  .vinfo small{color:var(--muted);font-size:12px}
  .vgo{color:var(--accent);font-size:14px;white-space:nowrap}

  .toast{position:fixed;left:50%;bottom:calc(var(--tabbar) + 18px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:#fff;padding:8px 16px;border-radius:999px;font-size:13px;z-index:30;opacity:0;transition:opacity .2s;pointer-events:none}
  .toast.show{opacity:1}
  footer{font-size:12.5px;color:var(--muted);margin-top:28px}
  footer details summary{cursor:pointer}
  .src{display:flex;gap:8px;padding:3px 0;border-bottom:1px dashed var(--line)}
  .src .ok{color:var(--accent)} .src .bad{color:var(--bad)}

  @media (max-width:520px){
    .grid{grid-template-columns:repeat(2,1fr);gap:10px}
    .title{font-size:13.5px}
    .brand{font-size:22px}
  }
  @media (min-width:900px){ .tiles{grid-template-columns:repeat(7,1fr)} .calls{grid-template-columns:repeat(4,180px)} }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="top">
      <a class="brand" href="#" data-tab="home"><span class="logo">移</span><span>移次<em>搞定</em></span></a>
      <small id="updated"></small>
    </div>
    <p class="tagline">移工文宣・新聞・專線，一次找齊 ✌️</p>
  </header>

  <div class="bar">
    <form class="search" id="form" role="search">
      <input id="q" type="search" placeholder="搜尋：毒品、交通、詐騙、ma túy、narkoba…" autocomplete="off" enterkeyhint="search">
      <button type="button" id="clear" title="清除">✕</button>
    </form>
    <div class="filters" id="filters" hidden></div>
  </div>

  <main id="out"></main>

  <footer id="foot" hidden>
    <details><summary>各來源最近一次抓取狀態</summary><div id="report"></div></details>
  </footer>
</div>

<nav class="tabbar" aria-label="主要分頁">
  <div class="tabs">
    <button class="tab" data-tab="home"><b>🏠</b>首頁</button>
    <button class="tab" data-tab="posters"><b>🗂️</b>文宣</button>
    <button class="tab" data-tab="news"><b>📰</b>新聞</button>
    <button class="tab" data-tab="help"><b>☎️</b>專線</button>
    <button class="tab" data-tab="fav"><b>❤️</b>收藏<span class="dot" id="favdot" hidden></span></button>
  </div>
</nav>

<div class="sheet" id="sheet" hidden>
  <div class="backdrop" data-close></div>
  <div class="panel" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
    <button class="x" data-close aria-label="關閉">✕</button>
    <h3 id="sheet-title"></h3>
    <div class="pm" id="sheet-meta"></div>
    <div class="pa" id="sheet-actions"></div>
    <div id="sheet-list"></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
const LANG_NAMES = { zh:'中文', vi:'越南', id:'印尼', th:'泰國', en:'英/菲', multi:'多國語' };
const FLAGS = { zh:'🇹🇼', vi:'🇻🇳', id:'🇮🇩', th:'🇹🇭', en:'🇵🇭', multi:'🌐' };
const LANG_ORDER = ['zh','vi','id','th','en','multi'];
const FILTER_KEYS = ['q','cat','agency','lang','type'];
const PAGE = 30;
const state = { tab:'home', q:'', cat:'', agency:'', lang:'', type:'', limit:PAGE };
let DATA = { items:[], categories:[] }, GROUPS = [], BYID = new Map(), NEWS = null, INFO = null;

const fold = s => String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/đ/g,'d').replace(/Đ/g,'D').toLowerCase().normalize('NFC');
const esc = s => String(s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const isImg = it => ['jpg','jpeg','png','gif','webp'].includes(it.ext);
const typeOf = it => isImg(it) ? 'img' : it.ext === 'pdf' ? 'pdf' : 'other';
const dateOf = it => it.date || (it.addedAt||'').slice(0,10);
const hasFilter = () => FILTER_KEYS.some(k => state[k]);
const catIcon = name => (DATA.categories.find(c => c.name === name) || {}).icon || '📁';

// ---------- 收藏（存在這支手機的瀏覽器裡） ----------
let FAV = [];
try { FAV = JSON.parse(localStorage.getItem('yici-fav') || '[]'); } catch { FAV = []; }
function saveFav(){ try { localStorage.setItem('yici-fav', JSON.stringify(FAV)); } catch {} updateFavDot(); }
const isFav = gid => FAV.includes(gid);
function toggleFav(gid){ FAV = isFav(gid) ? FAV.filter(x => x !== gid) : [gid, ...FAV]; saveFav(); toast(isFav(gid) ? '已加入收藏 ❤️' : '已取消收藏'); }
function updateFavDot(){ const d = document.getElementById('favdot'); d.hidden = !FAV.length; d.textContent = FAV.length; }

// ---------- 把各語言版本合成一組 ----------
function baseTitle(t){ return String(t).split('－')[0].trim(); }
const LABEL_LANG = [[/中文|華語|國語/,'zh'],[/越南|越文|tiếng việt/i,'vi'],[/印尼|indonesia/i,'id'],[/泰/,'th'],[/英文|英語|菲律賓|english|tagalog/i,'en']];
function effLangs(it){
  const label = String(it.title).split('－').slice(1).join('－');
  const hit = LABEL_LANG.find(([re]) => re.test(label));
  return hit ? [hit[1]] : (it.langs||[]);
}
function langRank(it){ const l = effLangs(it).find(x => x !== 'multi') || 'multi'; const r = LANG_ORDER.indexOf(l); return r < 0 ? 99 : r; }
function versionLabel(it){
  if (it.version) return it.version;
  const suffix = String(it.title).split('－').slice(1).join('－').trim();
  if (suffix) return suffix;
  const l = (it.langs||[]).filter(x => x !== 'multi');
  if (l.length === 1) return LANG_NAMES[l[0]] + '版';
  return (it.langs||[]).includes('multi') ? '多國語合輯' : (it.ext||'').toUpperCase();
}
function hashId(s){ let h = 5381; for (const c of s) h = ((h << 5) + h + c.codePointAt(0)) >>> 0; return h.toString(36); }
function buildGroups(items){
  const map = new Map();
  for (const it of items){
    const key = it.group || `${it.sourcePage}|${baseTitle(it.title)}`;
    if (!map.has(key)) map.set(key, []);
    map.get(key).push(it);
  }
  return [...map.entries()].map(([key, arr]) => {
    arr.sort((a,b) => langRank(a) - langRank(b));
    const langs = [...new Set(arr.flatMap(effLangs))];
    const categories = [...new Set(arr.flatMap(i => i.categories))];
    return {
      gid: hashId(key),
      title: arr[0].groupTitle || (arr.length > 1 ? baseTitle(arr[0].title) : arr[0].title),
      items: arr, cover: arr.find(i => i.thumb) || arr[0], langs, categories,
      primaryCategory: arr[0].primaryCategory, agency: arr[0].agency, sourcePage: arr[0].sourcePage,
      date: arr.map(dateOf).sort().pop(), addedAt: arr.map(i => i.addedAt).sort().pop(),
      text: fold(arr.map(i => [i.title, i.snippet, i.agency, i.sourceName, i.categories.join(' ')].join(' ')).join(' ') + ' ' + langs.map(l => LANG_NAMES[l]).join(' ')),
    };
  }).sort((a,b) => b.date.localeCompare(a.date) || b.addedAt.localeCompare(a.addedAt));
}

// ---------- 搜尋 ----------
function relatedCats(q){
  const fq = fold(q); if (!fq) return [];
  return DATA.categories.filter(c => fold(c.name).includes(fq) || c.keywords.some(k => { const fk = fold(k); return fk === fq || (fq.length >= 2 && fk.includes(fq)) || (fk.length >= 2 && fq.includes(fk)); })).map(c => c.name);
}
function score(g, terms, cats){
  if (!terms.length) return 1;
  const title = fold(g.title); let s = 0;
  if (terms.every(t => title.includes(t))) s += 6; else if (terms.every(t => g.text.includes(t))) s += 3;
  if (g.categories.some(c => cats.includes(c))) s += 4;
  return s;
}
function filtered(){
  const terms = fold(state.q).split(/\s+/).filter(Boolean), cats = relatedCats(state.q);
  return GROUPS
    .filter(g => !state.cat || g.categories.includes(state.cat))
    .filter(g => !state.agency || g.agency === state.agency)
    .filter(g => !state.lang || g.langs.includes(state.lang))
    .filter(g => !state.type || g.items.some(i => typeOf(i) === state.type))
    .map(g => ({ g, s: score(g, terms, cats) })).filter(x => x.s > 0)
    .sort((a,b) => b.s - a.s || b.g.date.localeCompare(a.g.date)).map(x => x.g);
}
function hl(text){
  let h = esc(text);
  for (const t of state.q.trim().split(/\s+/).filter(Boolean)){
    h = h.replace(new RegExp(esc(t).replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi'), m => `<mark>${m}</mark>`);
  }
  return h;
}

// ---------- 卡片 ----------
const viewHref = it => `view.html?id=${encodeURIComponent(it.id)}`;
const sizeTxt = it => it.size ? `${(it.size/1048576).toFixed(it.size>1048576?1:2)}MB` : '';
function thumbHtml(it){
  const typeLabel = `<span class="type">${esc((it.ext||'file').toUpperCase())}</span>`;
  return it.thumb ? `<img loading="lazy" src="${esc(it.thumb)}" alt="" onerror="this.outerHTML='${typeLabel.replace(/"/g,'&quot;')}'">` : typeLabel;
}
function flagsOf(g){ return LANG_ORDER.filter(l => g.langs.includes(l)).map(l => `<span title="${LANG_NAMES[l]}">${FLAGS[l]}</span>`).join(''); }
function card(g){
  const isNew = Date.now() - new Date(g.addedAt).getTime() < 7*864e5;
  const one = g.items.length === 1 ? g.items[0] : null;
  const open = one ? `<a class="thumb" href="${viewHref(one)}">` : `<button class="thumb" data-open="${g.gid}" aria-label="選擇語言">`;
  return `<article class="card">
    ${open}${thumbHtml(g.cover)}${isNew?'<span class="badge-new">NEW</span>':''}${one?'':`<span class="badge-count">${g.items.length} 種語言</span>`}${one?'</a>':'</button>'}
    <div class="body">
      <div class="title" title="${esc(g.title)}">${hl(g.title)}</div>
      <div class="meta">${esc(g.agency)} · ${esc(g.date)}</div>
      <div class="langs">${flagsOf(g)}</div>
      <span class="tag">${catIcon(g.primaryCategory)} ${esc(g.primaryCategory)}</span>
      <div class="actions">
        ${one ? `<a class="primary" href="${viewHref(one)}">開啟</a>` : `<button class="primary" data-open="${g.gid}">選擇語言</button>`}
        <button class="ib line" data-share="${g.gid}" title="分享到 LINE">LINE</button>
        <button class="ib ${isFav(g.gid)?'on':''}" data-fav="${g.gid}" title="收藏">${isFav(g.gid)?'♥':'♡'}</button>
      </div>
    </div></article>`;
}

function shareUrl(g){

async function share(g){

  window.open(`https://social-plugins.line.me/lineit/share?url=${encodeURIComponent(url)}&text=${encodeURIComponent(text)}`, '_blank', 'noopener');
}

function ago(iso){
  const m = Math.max(1, Math.round((Date.now() - new Date(iso).getTime()) / 6e4));
  if (m < 60) return `${m} 分鐘前`; const h = Math.round(m / 60); if (h < 24) return `${h} 小時前`; return `${Math.round(h / 24)} 天前`;
}
function newsList(limit){

function nowSeasons(){
  const m = new Date().getMonth() + 1;
  return (INFO?.seasons || []).filter(s => s.months.includes(m));

function upcomingEvents(days){
  const today = new Date(); today.setHours(0,0,0,0);
  return (INFO?.events || []).map(e => ({ ...e, left: Math.round((new Date(e.date + 'T00:00:00') - today) / 864e5) }))
    .filter(e => e.left >= 0 && e.left <= days).sort((a,b) => a.left - b.left);
}

// ---------- 畫面更新與網址 ----------
function render(){
  const out = document.getElementById('out');
  if (!GROUPS.length && ['home','posters','fav'].includes(state.tab)) { out.innerHTML = '<div class="empty">載入中…</div>'; return; }
  out.innerHTML = ({ home: homeView, posters: postersView, news: newsView, help: helpView, fav: favView }[state.tab] || homeView)();
  document.querySelectorAll('.tab').forEach(t => t.setAttribute('aria-current', t.dataset.tab === state.tab ? 'page' : 'false'));
  document.getElementById('foot').hidden = state.tab !== 'posters';
}
function update(mode){
  renderFilters(); render();
  const p = new URLSearchParams();
  if (state.tab !== 'home') p.set('tab', state.tab);
  if (state.tab === 'posters') for (const k of FILTER_KEYS) if (state[k]) p.set(k, state[k]);
  const url = p.toString() ? `#${p}` : location.pathname + location.search;
  if (mode === 'none') return;
  if (url !== (location.hash || location.pathname + location.search)) history[mode === 'replace' ? 'replaceState' : 'pushState'](null, '', url);
}
function go(tab, filters = {}, anchor){
  Object.assign(state, { tab, limit: PAGE }, tab === 'posters' ? {} : {});
  if (tab === 'posters') { for (const k of FILTER_KEYS) if (k !== 'q') state[k] = ''; Object.assign(state, filters); }
  update();
  if (anchor) setTimeout(() => document.getElementById(anchor)?.scrollIntoView({ behavior: 'smooth' }), 30);
  else window.scrollTo({ top: 0 });
}
function readHash(){
  const p = new URLSearchParams(location.hash.slice(1));
  state.tab = p.get('tab') || (p.get('q') || p.get('cat') || p.get('lang') ? 'posters' : 'home');
  for (const k of FILTER_KEYS) state[k] = p.get(k) || '';
  document.getElementById('q').value = state.q;
  return p.get('open');
}

  if ((x = el('[data-go-lang]'))) { go('posters', { lang: x.dataset.goLang }); return; }
  if ((x = el('[data-go-cat]'))) { go('posters', { cat: x.dataset.goCat }); return; }
  if ((x = el('[data-tab]'))) { e.preventDefault(); if (x.dataset.tab === 'home') { state.q = ''; document.getElementById('q').value = ''; } go(x.dataset.tab, {}, x.dataset.anchor); return; }
  if ((x = el('.chip[data-k]'))) { state[x.dataset.k] = state[x.dataset.k] === x.dataset.v ? '' : x.dataset.v; state.limit = PAGE; update(); return; }
  if (el('[data-more]')) { state.limit += PAGE; render(); return; }

});

  const open = readHash();
  renderFilters(); render();
  const j = u => fetch(u + '?' + Date.now()).then(r => r.json());
  const [cat, info, news] = await Promise.allSettled([j('catalog.json'), j('info.json'), j('news.json')]);
  if (cat.status === 'fulfilled') { DATA = cat.value; DATA.items ||= []; DATA.categories ||= []; }
  if (info.status === 'fulfilled') INFO = info.value;
  if (news.status === 'fulfilled') NEWS = news.value;
  GROUPS = buildGroups(DATA.items);
  document.getElementById('updated').innerHTML = DATA.updatedAt ? `${GROUPS.length} 則文宣<br>${new Date(DATA.updatedAt).toLocaleDateString('zh-TW')} 更新` : '';
  update('none');
  if (open) openSheet(GROUPS.find(g => g.gid === open));
  j('report.json').then(renderReport).catch(() => {});
})();
</script>
</body>
</html>
