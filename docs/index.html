<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>移次搞定｜移工文宣・新聞一次找齊</title>
<meta name="description" content="移次搞定：各政府機關移工宣導文宣（中、越、印、泰、英）與熱門移工新聞，一次找齊。">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2224%22 fill=%22%230f766e%22/><text x=%2250%22 y=%2270%22 font-size=%2260%22 text-anchor=%22middle%22 fill=%22white%22 font-family=%22sans-serif%22 font-weight=%22900%22>移</text></svg>">
<style>
  :root{
    --bg:#f6f3ec; --paper:#fffdf8; --ink:#1f2a2e; --muted:#6b7378; --line:#e4ddd0;
    --accent:#0f766e; --accent-soft:#d8efe9; --warn:#b45309; --bad:#b91c1c; --chip:#efe9dd;
    --radius:14px; --shadow:0 1px 2px rgba(0,0,0,.05),0 6px 18px rgba(31,42,46,.06);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font:15px/1.55 "Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif}
  a{color:var(--accent)}
  header{padding:28px 20px 8px;max-width:1180px;margin:0 auto}
  h1{margin:0;font-size:26px;letter-spacing:.02em}
  h1 small{font-size:13px;font-weight:400;color:var(--muted);margin-left:8px;letter-spacing:0}
  h1{display:flex;align-items:center;flex-wrap:wrap;gap:4px 0}
  .brand{display:inline-flex;align-items:center;gap:10px;font-weight:900;letter-spacing:.04em}
  .brand em{font-style:normal;background:linear-gradient(90deg,var(--accent),#f59e0b);-webkit-background-clip:text;background-clip:text;color:transparent}
  .logo{width:38px;height:38px;border-radius:11px;background:var(--accent);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:22px;transform:rotate(-6deg);box-shadow:3px 3px 0 #f59e0b}
  .tagline{font-size:14px;color:var(--ink);margin-top:6px;font-weight:600}
  .sub{color:var(--muted);font-size:13px;margin-top:4px}
  .bar{position:sticky;top:0;z-index:5;background:linear-gradient(var(--bg) 85%,transparent);padding:12px 20px 6px}
  .bar-in{max-width:1180px;margin:0 auto}
  .search{display:flex;gap:8px}
  .search input{flex:1;font:inherit;font-size:17px;padding:13px 16px;border:1.5px solid var(--line);
    border-radius:var(--radius);background:var(--paper);outline:none;box-shadow:var(--shadow)}
  .search input:focus{border-color:var(--accent)}
  .search button{font:inherit;border:0;border-radius:var(--radius);padding:0 16px;background:var(--chip);cursor:pointer}
  .filters{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;align-items:center}
  .chip{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:5px 11px;font-size:13px;cursor:pointer;
    white-space:nowrap;user-select:none}
  .chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
  .chip .n{opacity:.6;margin-left:3px}
  select.chip{appearance:none;padding-right:24px;background-image:linear-gradient(45deg,transparent 50%,#888 50%),linear-gradient(135deg,#888 50%,transparent 50%);
    background-position:calc(100% - 12px) 50%,calc(100% - 8px) 50%;background-size:4px 4px;background-repeat:no-repeat}
  .sep{width:1px;height:20px;background:var(--line);margin:0 4px}
  main{max-width:1180px;margin:0 auto;padding:4px 20px 60px}
  .hint{background:var(--accent-soft);border-radius:10px;padding:8px 12px;font-size:13px;margin:6px 0 14px}
  section.cat{margin:22px 0 8px}
  section.cat h2{font-size:18px;margin:0 0 10px;display:flex;align-items:baseline;gap:8px}
  section.cat h2 .n{font-size:13px;color:var(--muted);font-weight:400}
  section.cat h2 button{margin-left:auto;font:inherit;font-size:13px;border:0;background:none;color:var(--accent);cursor:pointer}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
  .card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--shadow)}
  .thumb{aspect-ratio:4/3;background:#ece6da;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}
  .thumb{text-decoration:none}
  .thumb img{width:100%;height:100%;object-fit:cover;object-position:top}
  .thumb .type{font-weight:700;font-size:22px;color:#8a7f6c;letter-spacing:.06em}
  .badge-new{position:absolute;top:8px;left:8px;background:var(--warn);color:#fff;font-size:11px;padding:2px 7px;border-radius:6px}
  .body{padding:10px 12px 12px;display:flex;flex-direction:column;gap:6px;flex:1}
  .title{font-weight:600;font-size:14.5px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
  .meta{font-size:12px;color:var(--muted)}
  .tags{display:flex;flex-wrap:wrap;gap:4px}
  .tag{font-size:11.5px;background:var(--chip);border-radius:6px;padding:1px 7px}
  .tag.lang{background:var(--accent-soft)}
  .actions{display:flex;gap:6px;margin-top:auto;padding-top:4px}
  .actions a{flex:1;text-align:center;font-size:13px;text-decoration:none;border-radius:9px;padding:7px 0;border:1px solid var(--line)}
  .actions a.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
  .empty{text-align:center;color:var(--muted);padding:60px 0}
  footer{max-width:1180px;margin:0 auto;padding:0 20px 40px;font-size:12.5px;color:var(--muted)}
  details summary{cursor:pointer}
  .src{display:flex;gap:8px;padding:3px 0;border-bottom:1px dashed var(--line)}
  .src .ok{color:var(--accent)} .src .bad{color:var(--bad)}
  mark{background:#fde68a;padding:0 1px;border-radius:2px}
  @media (max-width:520px){ .filters{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;scrollbar-width:none} .grid{grid-template-columns:repeat(2,1fr);gap:10px} h1{font-size:23px} .logo{width:32px;height:32px;font-size:19px} .title{font-size:13.5px} }
  button.thumb{border:0;padding:0;width:100%;cursor:pointer;font:inherit}
  .badge-count{position:absolute;right:8px;bottom:8px;background:rgba(31,42,46,.82);color:#fff;font-size:11.5px;padding:3px 8px;border-radius:999px}
  .sheet{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center}
  .sheet[hidden]{display:none}
  .sheet .backdrop{position:absolute;inset:0;background:rgba(20,25,28,.45)}
  .sheet .panel{position:relative;background:var(--paper);width:min(560px,100%);max-height:85vh;overflow:auto;
    border-radius:18px 18px 0 0;padding:18px 18px 24px;box-shadow:0 -10px 30px rgba(0,0,0,.18);animation:up .18s ease-out}
  @media (min-width:700px){ .sheet{align-items:center} .sheet .panel{border-radius:18px} }
  @keyframes up{from{transform:translateY(30px);opacity:.5}to{transform:none;opacity:1}}
  .panel h3{margin:0 34px 4px 0;font-size:17px;line-height:1.4}
  .panel .x{position:absolute;top:12px;right:12px;border:0;background:var(--chip);width:32px;height:32px;border-radius:50%;font-size:16px;cursor:pointer}
  .panel .pm{font-size:12.5px;color:var(--muted);margin-bottom:12px}
  .ver{display:flex;align-items:center;gap:12px;padding:10px;border:1px solid var(--line);border-radius:12px;margin-top:8px;text-decoration:none;color:inherit}
  .ver:active,.ver:hover{border-color:var(--accent);background:#f3faf8}
  .vthumb{width:64px;height:64px;flex:none;border-radius:8px;overflow:hidden;background:#ece6da;display:flex;align-items:center;justify-content:center}
  .vthumb img{width:100%;height:100%;object-fit:cover;object-position:top}
  .vthumb .type{font-size:12px}
  .vinfo{flex:1;display:flex;flex-direction:column}
  .vinfo small{color:var(--muted);font-size:12px}
  .vgo{color:var(--accent);font-size:14px;white-space:nowrap}
  .more{text-align:center;margin:18px 0 4px}
  .more button{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--paper);color:var(--accent);border-radius:999px;padding:9px 22px;cursor:pointer}
  .hint2{text-align:center;color:var(--muted);font-size:13px;margin:14px 0 0}
  .chip.home[aria-pressed="true"]{background:var(--warn);border-color:var(--warn)}
  .backbar{display:flex;align-items:center;gap:10px;margin:4px 0 14px;font-size:13px;color:var(--muted);flex-wrap:wrap}
  .backbar button{font:inherit;font-size:14px;border:1px solid var(--accent);color:var(--accent);background:var(--paper);border-radius:999px;padding:6px 14px;cursor:pointer}
  .news{margin:18px 0 6px}
  .news h2{font-size:18px;margin:0 0 10px;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
  .news h2 .n{font-size:12.5px;color:var(--muted);font-weight:400}
  .newslist{list-style:none;margin:0;padding:0;background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
  .newslist li{display:flex;gap:12px;padding:12px 14px;border-top:1px solid var(--line)}
  .newslist li:first-child{border-top:0}
  .rank{flex:none;width:26px;height:26px;border-radius:8px;background:var(--chip);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;color:var(--muted)}
  .newslist li:nth-child(-n+3) .rank{background:var(--warn);color:#fff}
  .nbody{flex:1;min-width:0}
  .ntitle{color:var(--ink);text-decoration:none;font-weight:600;line-height:1.45}
  .ntitle:hover{color:var(--accent)}
  .nmeta{font-size:12px;color:var(--muted);margin-top:3px}
  .ncount{color:var(--warn);font-weight:600}
  .nbody details{font-size:12.5px;margin-top:4px}
  .nbody summary{color:var(--accent);cursor:pointer}
  .nbody details a{display:block;color:var(--muted);text-decoration:none;padding:3px 0}
</style>
</head>
<body>
<header>
  <h1><span class="brand"><span class="logo">移</span><span>移次<em>搞定</em></span></span><small id="count"></small></h1>
  <div class="tagline">移工文宣・新聞，一次找齊 ✌️</div>
  <div class="sub" id="updated">載入中…</div>
</header>

<div class="bar"><div class="bar-in">
  <form class="search" id="form">
    <input id="q" type="search" placeholder="搜尋：毒品、交通、詐騙、ma túy、narkoba…" autocomplete="off">
    <button type="button" id="clear" title="清除">✕</button>
  </form>
  <div class="filters" id="filters"></div>
</div></div>

<main id="out"></main>

<div class="sheet" id="sheet" hidden>
  <div class="backdrop" data-close></div>
  <div class="panel" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
    <button class="x" data-close aria-label="關閉">✕</button>
    <h3 id="sheet-title"></h3>
    <div class="pm" id="sheet-meta"></div>
    <div id="sheet-list"></div>
  </div>
</div>

<footer>
  <details><summary>各來源最近一次抓取狀態</summary><div id="report"></div></details>
</footer>

<script>
const LANG_NAMES = { zh:'中文', vi:'越南', id:'印尼', th:'泰國', en:'英/菲', multi:'多國語' };
const LANG_ORDER = ['zh','vi','id','th','en','multi'];
const HOME_PAGE = 12;
const state = { q:'', cat:'', agency:'', lang:'', type:'', expanded:new Set(), homeLimit: HOME_PAGE };
let DATA = { items:[], categories:[] };
let GROUPS = [];
let NEWS = null;

const fold = s => String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'')
  .replace(/đ/g,'d').replace(/Đ/g,'D').toLowerCase().normalize('NFC');
const esc = s => String(s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const isImg = it => ['jpg','jpeg','png','gif','webp'].includes(it.ext);
const typeOf = it => isImg(it) ? 'img' : it.ext === 'pdf' ? 'pdf' : 'other';
const dateOf = it => it.date || (it.addedAt||'').slice(0,10);

/** 同一則公告（同一個原網頁＋同一個主標題）的各國語言版本合成一組 */
function baseTitle(t){ return String(t).split('－')[0].trim(); }
function versionLabel(it){
  if (it.version) return it.version;
  const suffix = String(it.title).split('－').slice(1).join('－').trim();
  if (suffix) return suffix;
  const l = (it.langs||[]).filter(x => x !== 'multi');
  if (l.length === 1) return LANG_NAMES[l[0]] + '版';
  return (it.langs||[]).includes('multi') ? '多國語合輯' : (it.ext||'').toUpperCase();
}
const LABEL_LANG = [[/中文|華語|國語/,'zh'],[/越南|越文|tiếng việt/i,'vi'],[/印尼|indonesia/i,'id'],[/泰/,'th'],[/英文|英語|菲律賓|english|tagalog/i,'en']];
/** 依「版本名稱」補正語言（例如「－中文版」），並決定排序：中文、越、印、泰、英、合輯 */
function effLangs(it){
  const label = String(it.title).split('－').slice(1).join('－');
  const hit = LABEL_LANG.find(([re]) => re.test(label));
  return hit ? [hit[1]] : (it.langs||[]);
}
function langRank(it){
  const l = effLangs(it).find(x => x !== 'multi') || 'multi';
  const r = LANG_ORDER.indexOf(l); return r < 0 ? 99 : r;
}
function buildGroups(items){
  const map = new Map();
  for (const it of items){
    const key = it.group || `${it.sourcePage}|${baseTitle(it.title)}`;
    if (!map.has(key)) map.set(key, []);
    map.get(key).push(it);
  }
  return [...map.values()].map(arr => {
    arr.sort((a,b) => langRank(a) - langRank(b));
    const langs = [...new Set(arr.flatMap(effLangs))];
    const categories = [...new Set(arr.flatMap(i => i.categories))];
    const cover = arr.find(i => i.thumb) || arr[0];
    return {
      title: arr[0].groupTitle || (arr.length > 1 ? baseTitle(arr[0].title) : arr[0].title),
      items: arr, cover, langs, categories,
      primaryCategory: arr[0].primaryCategory,
      agency: arr[0].agency, sourcePage: arr[0].sourcePage,
      date: arr.map(dateOf).sort().pop(),
      addedAt: arr.map(i=>i.addedAt).sort().pop(),
      text: fold(arr.map(i => [i.title, i.snippet, i.agency, i.sourceName, i.categories.join(' ')].join(' ')).join(' ') + ' ' + langs.map(l=>LANG_NAMES[l]).join(' ')),
    };
  });
}

/** 找出這次搜尋「連帶」的類別：輸入 毒品 → 反毒類（裡面有越南文、印尼文的同義字） */
function relatedCats(q){
  const fq = fold(q);
  if (!fq) return [];
  return DATA.categories.filter(c =>
    fold(c.name).includes(fq) || c.keywords.some(k => { const fk = fold(k); return fk === fq || (fq.length >= 2 && fk.includes(fq)) || (fk.length >= 2 && fq.includes(fk)); })
  ).map(c => c.name);
}

function score(g, terms, cats){
  if (!terms.length) return 1;
  const title = fold(g.title);
  let s = 0;
  if (terms.every(t => title.includes(t))) s += 6;
  else if (terms.every(t => g.text.includes(t))) s += 3;
  if (g.categories.some(c => cats.includes(c))) s += 4;
  return s;
}

function filtered(){
  const terms = fold(state.q).split(/\s+/).filter(Boolean);
  const cats = relatedCats(state.q);
  return GROUPS
    .filter(g => !state.cat || g.categories.includes(state.cat))
    .filter(g => !state.agency || g.agency === state.agency)
    .filter(g => !state.lang || g.langs.includes(state.lang))
    .filter(g => !state.type || g.items.some(i => typeOf(i) === state.type))
    .map(g => ({ g, s: score(g, terms, cats) }))
    .filter(x => x.s > 0)
    .sort((a,b) => b.s - a.s || b.g.date.localeCompare(a.g.date))
    .map(x => x.g);
}

function hl(text){
  const terms = state.q.trim().split(/\s+/).filter(Boolean);
  let h = esc(text);
  for (const t of terms){
    const re = new RegExp(esc(t).replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi');
    h = h.replace(re, m => `<mark>${m}</mark>`);
  }
  return h;
}

function thumbHtml(it){
  const typeLabel = `<span class="type">${esc((it.ext||'file').toUpperCase())}</span>`;
  return it.thumb
    ? `<img loading="lazy" src="${esc(it.thumb)}" alt="" onerror="this.outerHTML='${typeLabel.replace(/"/g,'&quot;')}'">`
    : typeLabel;
}
// 先開本站的檢視頁（政府網站的檔案多半設成強制下載，手機直接開會空白）
const viewHref = it => `view.html?id=${encodeURIComponent(it.id)}`;
const sizeTxt = it => it.size ? `${(it.size/1048576).toFixed(it.size>1048576?1:2)}MB` : '';

function card(g){
  const idx = GROUPS.indexOf(g);
  const isNew = Date.now() - new Date(g.addedAt).getTime() < 7*864e5;
  const one = g.items.length === 1 ? g.items[0] : null;
  const langTags = LANG_ORDER.filter(l => g.langs.includes(l)).map(l=>`<span class="tag lang">${LANG_NAMES[l]}</span>`).join('');
  const cover = one
    ? `<a class="thumb" href="${viewHref(one)}">`
    : `<button class="thumb" data-open="${idx}">`;
  return `<article class="card">
    ${cover}${thumbHtml(g.cover)}${isNew?'<span class="badge-new">NEW</span>':''}${one?'':`<span class="badge-count">${g.items.length} 種版本</span>`}${one?'</a>':'</button>'}
    <div class="body">
      <div class="title" title="${esc(g.title)}">${hl(g.title)}</div>
      <div class="meta">${esc(g.agency)} · ${esc(g.date)}${one && sizeTxt(one) ? ' · '+sizeTxt(one) : ''}</div>
      <div class="tags">${langTags}${g.categories.slice(0,2).map(c=>`<span class="tag">${esc(c)}</span>`).join('')}</div>
      <div class="actions">
        ${one
          ? `<a class="primary" href="${viewHref(one)}">開啟檔案</a>`
          : `<a class="primary" href="#" data-open="${idx}">選擇語言</a>`}
        <a href="${esc(g.sourcePage)}" target="_blank" rel="noopener">原網頁</a>
      </div>
    </div></article>`;
}

function ago(iso){
  const m = Math.max(1, Math.round((Date.now() - new Date(iso).getTime()) / 6e4));
  if (m < 60) return `${m} 分鐘前`;
  const h = Math.round(m / 60); if (h < 24) return `${h} 小時前`;
  return `${Math.round(h / 24)} 天前`;
}
function newsHtml(){
  const items = (NEWS && NEWS.items) || [];
  if (!items.length) return '';
  return `<section class="news"><h2>🔥 熱門移工新聞<span class="n">近 ${NEWS.days || 3} 天・依報導媒體數排序・${ago(NEWS.updatedAt)}更新</span></h2>
    <ol class="newslist">${items.map((n, i) => `
      <li>
        <span class="rank">${i + 1}</span>
        <div class="nbody">
          <a class="ntitle" href="${esc(n.link)}" target="_blank" rel="noopener">${esc(n.title)}</a>
          <div class="nmeta">${esc(n.source)} · ${ago(n.pubDate)}${n.count > 1 ? ` · <span class="ncount">${n.count} 家媒體報導</span>` : ''}</div>
          ${n.sources.length > 1 ? `<details><summary>看其他媒體</summary>${n.sources.filter(x => x.link !== n.link).map(x => `<a href="${esc(x.link)}" target="_blank" rel="noopener">${esc(x.name)}：${esc(x.title)}</a>`).join('')}</details>` : ''}
        </div>
      </li>`).join('')}</ol></section>`;
}
function openSheet(g){
  const sheet = document.getElementById('sheet');
  document.getElementById('sheet-title').textContent = g.title;
  document.getElementById('sheet-meta').innerHTML = `${esc(g.agency)} · ${esc(g.date)} · <a href="${esc(g.sourcePage)}" target="_blank" rel="noopener">原網頁</a>`;
  document.getElementById('sheet-list').innerHTML = g.items.map(it => `
    <a class="ver" href="${viewHref(it)}">
      <span class="vthumb">${thumbHtml(it)}</span>
      <span class="vinfo"><b>${esc(versionLabel(it))}</b><small>${esc((it.ext||'').toUpperCase())}${sizeTxt(it)?' · '+sizeTxt(it):''}</small></span>
      <span class="vgo">開啟 ›</span>
    </a>`).join('');
  sheet.hidden = false;
  document.body.style.overflow = 'hidden';
}
function closeSheet(){ document.getElementById('sheet').hidden = true; document.body.style.overflow = ''; }

function renderFilters(){
  const count = (fn) => GROUPS.filter(fn).length;
  const catChips = DATA.categories.map(c => {
    const n = count(g => g.categories.includes(c.name));
    if (!n) return '';
    return `<span class="chip" data-k="cat" data-v="${esc(c.name)}" aria-pressed="${state.cat===c.name}">${c.icon||''} ${esc(c.name)}<span class="n">${n}</span></span>`;
  }).join('');
  const agencies = [...new Set(GROUPS.map(g=>g.agency))].sort();
  const langs = LANG_ORDER.filter(l => count(g => g.langs.includes(l)));
  const noFilter = !(state.q.trim() || state.cat || state.agency || state.lang || state.type);
  document.getElementById('filters').innerHTML = `<span class="chip home" data-home aria-pressed="${noFilter}">🆕 最新更新</span>` + catChips
    + `<span class="sep"></span>`
    + langs.map(l=>`<span class="chip" data-k="lang" data-v="${l}" aria-pressed="${state.lang===l}">${LANG_NAMES[l]}</span>`).join('')
    + `<span class="sep"></span>`
    + [['img','圖片'],['pdf','PDF'],['other','其他檔']].map(([v,t])=>`<span class="chip" data-k="type" data-v="${v}" aria-pressed="${state.type===v}">${t}</span>`).join('')
    + `<select class="chip" id="agency"><option value="">全部機關</option>${agencies.map(a=>`<option ${state.agency===a?'selected':''}>${esc(a)}</option>`).join('')}</select>`;
  document.getElementById('agency').onchange = e => { state.agency = e.target.value; update(); };
}

function render(){
  const list = filtered();
  const out = document.getElementById('out');
  const searching = state.q.trim() || state.cat || state.agency || state.lang || state.type;
  if (!GROUPS.length){
    out.innerHTML = `<div class="empty">還沒有資料。第一次排程跑完後就會出現（GitHub → Actions → 每日抓取文宣 → Run workflow 可以馬上跑）。</div>`;
    return;
  }
  if (!list.length){ out.innerHTML = `<div class="empty">找不到「${esc(state.q)}」相關文宣，換個關鍵字試試</div>`; return; }

  let html = '';
  const rc = relatedCats(state.q);
  if (state.q.trim() && rc.length){
    const kw = DATA.categories.filter(c=>rc.includes(c.name)).flatMap(c=>c.keywords).filter(k=>!/[一-鿿]|^\d+$/.test(k)).slice(0,6);
    html += `<div class="hint">「${esc(state.q)}」同時帶出類別：<b>${rc.map(esc).join('、')}</b>${kw.length?`（含外語文宣，如 ${kw.map(esc).join('、')}）`:''}　共 ${list.length} 則</div>`;
  }
  if (searching){
    const what = [state.q.trim() && `「${esc(state.q.trim())}」`, state.cat, state.lang && LANG_NAMES[state.lang], state.type && {img:'圖片',pdf:'PDF',other:'其他檔'}[state.type], state.agency].filter(Boolean).join('・');
    html += `<div class="backbar"><button data-home>‹ 返回最新更新</button><span>目前：${what}・${list.length} 則</span></div>`;
    html += `<div class="grid">${list.slice(0,300).map(card).join('')}</div>`;
    if (list.length > 300) html += `<p class="empty">只顯示前 300 則，請加關鍵字縮小範圍</p>`;
  } else {
    // 首頁上方：熱門移工新聞（各家媒體同一則已合併）
    html += newsHtml();
    // 沒有搜尋時：首頁只顯示最新發布的文宣（依發布日期），其他用搜尋或類別找
    const latest = [...list].sort((a,b) => b.date.localeCompare(a.date) || b.addedAt.localeCompare(a.addedAt));
    const shown = latest.slice(0, state.homeLimit);
    html += `<section class="cat"><h2>🆕 最新更新<span class="n">依發布日期・共 ${latest.length} 則</span></h2>
      <div class="grid">${shown.map(card).join('')}</div>
      ${latest.length > shown.length ? `<div class="more"><button data-more>再看 ${Math.min(HOME_PAGE, latest.length - shown.length)} 則</button></div>` : ''}
      <p class="hint2">要找特定主題，請直接搜尋（例如「毒品」）或點上方類別</p></section>`;
  }
  out.innerHTML = html;
}

function update(pushHash=true){
  renderFilters(); render();
  if (pushHash){
    const p = new URLSearchParams();
    for (const k of ['q','cat','agency','lang','type']) if (state[k]) p.set(k, state[k]);
    const url = p.toString() ? `#${p}` : location.pathname;
    if (url !== (location.hash || location.pathname)) {
      if (pushHash === 'replace') history.replaceState(null,'', url); else history.pushState(null,'', url);
    }
  }
}

function renderReport(rep){
  if (!rep?.sources) return;
  document.getElementById('report').innerHTML = `<p>最近一次：${new Date(rep.finishedAt).toLocaleString('zh-TW')}</p>` +
    rep.sources.map(s=>`<div class="src"><span class="${s.ok&&!s.errors.length?'ok':s.ok?'':'bad'}">${s.ok? (s.errors.length?'⚠':'✔') : '✘'}</span>
      <span><b>${esc(s.agency)}</b> ${esc(s.name)}：新增 ${s.newCount} 筆${s.errors.length?`<br><small>${s.errors.slice(0,3).map(esc).join('<br>')}</small>`:''}</span></div>`).join('');
}

document.addEventListener('click', e => {
  const op = e.target.closest('[data-open]');
  if (op){ e.preventDefault(); openSheet(GROUPS[Number(op.dataset.open)]); return; }
  if (e.target.closest('[data-close]')){ closeSheet(); return; }
  const chip = e.target.closest('.chip[data-k]');
  if (chip){ const k = chip.dataset.k, v = chip.dataset.v; state[k] = state[k]===v ? '' : v; update(); return; }
  if (e.target.closest('[data-home]')){ goHome(); return; }
  if (e.target.closest('[data-more]')){ state.homeLimit += HOME_PAGE; render(); return; }
  const ex = e.target.closest('[data-expand]');
  if (ex){ const n = ex.dataset.expand; state.expanded.has(n)?state.expanded.delete(n):state.expanded.add(n); render(); }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); });
let t;
document.getElementById('q').addEventListener('input', e => { clearTimeout(t); t = setTimeout(()=>{ state.q = e.target.value; update('replace'); }, 180); });
document.getElementById('form').addEventListener('submit', e => e.preventDefault());
function goHome(){ Object.assign(state,{q:'',cat:'',agency:'',lang:'',type:'',homeLimit:HOME_PAGE}); document.getElementById('q').value=''; update(); window.scrollTo({top:0,behavior:'smooth'}); }
document.getElementById('clear').onclick = goHome;
// 手機「上一頁」也能回到上一個畫面（例如從類別回到最新更新）
window.addEventListener('hashchange', () => {
  const p = new URLSearchParams(location.hash.slice(1));
  for (const k of ['q','cat','agency','lang','type']) state[k] = p.get(k) || '';
  document.getElementById('q').value = state.q; update(false);
});

(async () => {
  try {
    const r = await fetch('catalog.json?'+Date.now()); DATA = await r.json();
    DATA.items ||= []; DATA.categories ||= [];
  } catch { DATA = { items:[], categories:[] }; }
  GROUPS = buildGroups(DATA.items);
  const p = new URLSearchParams(location.hash.slice(1));
  for (const k of ['q','cat','agency','lang','type']) state[k] = p.get(k) || '';
  document.getElementById('q').value = state.q;
  document.getElementById('count').textContent = GROUPS.length ? `共 ${GROUPS.length} 則・${DATA.items.length} 個檔案` : '';
  document.getElementById('updated').textContent = DATA.updatedAt ? `每天自動更新，最後更新：${new Date(DATA.updatedAt).toLocaleString('zh-TW')}` : '尚未更新';
  update(false);
  fetch('news.json?'+Date.now()).then(r=>r.json()).then(n=>{ NEWS = n; if (!(state.q.trim()||state.cat||state.agency||state.lang||state.type)) render(); }).catch(()=>{});
  fetch('report.json?'+Date.now()).then(r=>r.json()).then(renderReport).catch(()=>{});
})();
</script>
</body>
</html>
